<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:," />
    <title>資産ダッシュボード</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #faf7f0;
        --surface: #ffffff;
        --surface-2: #f6f1e7;
        --text: #2f353b;
        --dim: #6f767e;
        --border: #e7dfcd;
        --accent: #527ca3;
        --accent-strong: #3f6690;
        --accent-soft: #e8eff6;
        --green: #6d9448;
        --green-soft: #eef3e6;
        --pink: #cf7d88;
        --pink-soft: #faedef;
        --amber: #c99a3c;
        --danger: #c0564f;
        --radius: 18px;
        --radius-sm: 12px;
        --shadow-card: 0 1px 2px rgb(90 78 50 / 0.05), 0 8px 24px -12px rgb(90 78 50 / 0.14);
        --shadow-nav: 0 -6px 24px -12px rgb(90 78 50 / 0.22);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1b1f24;
          --surface: #262b31;
          --surface-2: #2d333a;
          --text: #eef1f4;
          --dim: #a3adb6;
          --border: #3a4149;
          --accent: #8fb0d1;
          --accent-strong: #a9c6e2;
          --accent-soft: #2c3844;
          --green: #a5c48a;
          --green-soft: #2e3a28;
          --pink: #e5a7ae;
          --pink-soft: #3d2c2e;
          --amber: #dcb26a;
          --danger: #e08a84;
          --shadow-card: 0 1px 2px rgb(0 0 0 / 0.25), 0 10px 28px -14px rgb(0 0 0 / 0.5);
          --shadow-nav: 0 -6px 24px -12px rgb(0 0 0 / 0.6);
        }
      }

      * { box-sizing: border-box; }
      html {
        /* Stop mobile browsers inflating text (a cause of caret/layout drift). */
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", sans-serif;
        font-size: 16px;
        line-height: 1.55;
        padding-bottom: calc(76px + env(safe-area-inset-bottom));
      }
      @media (min-width: 721px) { body { padding-bottom: 40px; } }

      /* Every form control at 16px+: focusing never triggers iOS auto-zoom. */
      input, select, textarea { font-size: 16px; font-family: inherit; }
      button, [role="button"], select, summary,
      input:not([type="checkbox"], [type="radio"]) { min-height: 2.25rem; }
      button { font-family: inherit; cursor: pointer; transition: background-color 120ms ease, color 120ms ease, border-color 120ms ease; }
      :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

      .num { font-variant-numeric: tabular-nums; font-feature-settings: "tnum" 1; letter-spacing: 0.01em; }
      .wrap { max-width: 880px; margin: 0 auto; padding: 16px 16px 8px; }
      @media (min-width: 721px) { .wrap { padding-top: 24px; } }
      .stack > * + * { margin-top: 20px; }

      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        box-shadow: var(--shadow-card);
        padding: 20px;
      }
      .card h2, .section-title {
        font-size: 17px; font-weight: 700; line-height: 1.35;
        margin: 0 0 16px; letter-spacing: -0.01em;
      }
      .dim { color: var(--dim); }
      .small { font-size: 13px; }
      .note { font-size: 12.5px; line-height: 1.7; color: var(--dim); }
      .divider-note { border-top: 1px solid var(--border); margin-top: 16px; padding-top: 12px; }

      /* ---------- Tabs ---------- */
      .topbar {
        display: none;
        position: sticky; top: 0; z-index: 20;
        background: color-mix(in srgb, var(--bg) 88%, transparent);
        backdrop-filter: blur(8px);
        border-bottom: 1px solid var(--border);
      }
      .topbar-inner { max-width: 880px; margin: 0 auto; padding: 10px 16px; display: flex; gap: 6px; }
      .bottomnav {
        position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
        background: var(--surface);
        border-top: 1px solid var(--border);
        box-shadow: var(--shadow-nav);
        padding-bottom: env(safe-area-inset-bottom);
        display: flex;
      }
      @media (min-width: 721px) {
        .topbar { display: block; }
        .bottomnav { display: none; }
      }
      .tab-btn {
        flex: 1 1 0; border: 0; background: transparent; color: var(--dim);
        font-size: 13px; font-weight: 600; padding: 10px 2px; min-height: 3rem;
        border-radius: 10px; white-space: nowrap;
      }
      .topbar .tab-btn { flex: 0 1 auto; font-size: 14px; padding: 8px 14px; min-height: 2.5rem; }
      .tab-btn[aria-selected="true"] { color: var(--accent-strong); background: var(--accent-soft); }

      /* ---------- Buttons / inputs / chips ---------- */
      .btn-primary {
        border: 0; border-radius: var(--radius-sm); background: var(--accent);
        color: #fff; padding: 10px 16px; font-size: 14px; font-weight: 700;
        box-shadow: 0 4px 12px -6px var(--accent);
      }
      .btn-primary:disabled { opacity: 0.5; }
      .btn-ghost {
        border: 1px solid var(--border); border-radius: var(--radius-sm);
        background: var(--surface); color: var(--text);
        padding: 8px 14px; font-size: 14px; font-weight: 500;
      }
      .btn-ghost:disabled { opacity: 0.5; }
      .btn-danger {
        border: 1px solid var(--border); border-radius: var(--radius-sm);
        background: var(--surface); color: var(--danger);
        padding: 8px 12px; font-size: 14px; font-weight: 500;
      }
      .input {
        width: 100%;
        border: 1px solid var(--border); border-radius: var(--radius-sm);
        background: var(--surface-2); color: var(--text);
        padding: 9px 12px; outline: none;
      }
      .input:focus { border-color: var(--accent); }
      .field { display: block; margin-bottom: 14px; }
      .field > .flabel { display: block; font-size: 14px; font-weight: 500; margin-bottom: 5px; }
      .field .hint { display: block; font-size: 12.5px; color: var(--dim); margin-top: 4px; }

      .chips { display: flex; flex-wrap: wrap; gap: 8px; }
      .chip {
        border: 1px solid var(--border); border-radius: 999px;
        background: var(--surface); color: var(--text);
        padding: 7px 13px; font-size: 14px; font-weight: 500; min-height: 2.25rem;
      }
      .chip[aria-pressed="true"] {
        background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700;
      }
      .chip-green[aria-pressed="true"] { background: var(--green); border-color: var(--green); }

      /* ---------- Lists / slices ---------- */
      .slice-list { list-style: none; margin: 16px 0 0; padding: 0; }
      .slice-list li { padding: 7px 0; }
      .slice-head { display: flex; align-items: baseline; gap: 8px; font-size: 14px; }
      .dot { width: 10px; height: 10px; border-radius: 3px; flex: 0 0 10px; align-self: center; }
      .slice-name { font-weight: 500; }
      .slice-val { margin-left: auto; font-weight: 700; }
      .slice-pct { color: var(--dim); font-size: 13px; min-width: 52px; text-align: right; }
      .bar-track { height: 6px; border-radius: 3px; background: var(--surface-2); margin-top: 5px; overflow: hidden; }
      .bar-fill { height: 100%; border-radius: 3px; }

      .donut-flex { display: flex; gap: 20px; align-items: center; flex-wrap: wrap; }
      .donut-flex .slice-list { flex: 1 1 220px; margin-top: 0; }

      .progress-track { height: 10px; border-radius: 5px; background: var(--surface-2); overflow: hidden; }
      .progress-fill { height: 100%; border-radius: 5px; }

      .pill {
        display: inline-flex; align-items: center; border-radius: 999px;
        padding: 4px 10px; font-size: 13px; font-weight: 700;
      }
      .count-badge {
        border-radius: 999px; background: var(--surface-2); color: var(--dim);
        padding: 4px 10px; font-size: 12px; font-weight: 700; white-space: nowrap;
      }

      /* ---------- Asset rows ---------- */
      .asset-list { list-style: none; margin: 0; padding: 0; }
      .asset-list li { padding: 14px 0; border-bottom: 1px solid var(--border); }
      .asset-list li:last-child { border-bottom: 0; padding-bottom: 2px; }
      .asset-top { display: flex; align-items: baseline; gap: 10px; }
      .asset-name { font-weight: 700; min-width: 0; overflow-wrap: anywhere; }
      .asset-value { margin-left: auto; font-weight: 800; font-size: 17px; white-space: nowrap; }
      .asset-meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 7px; align-items: center; }
      .tag {
        font-size: 12px; font-weight: 600; border-radius: 999px; padding: 3px 9px;
        background: var(--surface-2); color: var(--dim);
      }
      .tag b { color: var(--text); font-weight: 700; }
      .asset-actions { display: flex; gap: 8px; margin-top: 10px; }
      .asset-actions button { padding: 6px 12px; font-size: 13px; }

      /* ---------- Target allocation rows ----------
         One row per class: label / current % / input. The input has a
         single dedicated width rule — no competing width utilities —
         so rows can never overlap or shift (a past bug). */
      .target-row {
        display: flex; align-items: center; gap: 12px;
        padding: 9px 0; border-bottom: 1px solid var(--border);
      }
      .target-row:last-of-type { border-bottom: 0; }
      .target-label { flex: 1 1 auto; min-width: 0; display: flex; align-items: center; gap: 8px; font-weight: 500; font-size: 15px; }
      .target-current { flex: 0 0 74px; text-align: right; color: var(--dim); font-size: 14px; }
      .target-input-wrap { flex: 0 0 96px; width: 96px; display: flex; align-items: center; gap: 5px; }
      .target-input {
        width: 72px; flex: 0 0 72px;
        border: 1px solid var(--border); border-radius: 10px;
        background: var(--surface-2); color: var(--text);
        padding: 8px 10px; text-align: right; outline: none;
      }
      .target-input:focus { border-color: var(--accent); }
      .target-unit { color: var(--dim); font-size: 14px; }

      .mix-row { display: flex; align-items: center; gap: 10px; padding: 6px 0; }
      .mix-name { flex: 1 1 auto; font-size: 14px; display: flex; gap: 8px; align-items: center; min-width: 0; }
      .mix-input-wrap { flex: 0 0 92px; width: 92px; display: flex; align-items: center; gap: 5px; }
      .mix-input {
        width: 68px; flex: 0 0 68px;
        border: 1px solid var(--border); border-radius: 10px;
        background: var(--surface-2); color: var(--text);
        padding: 7px 9px; text-align: right; outline: none;
      }
      .mix-input:focus { border-color: var(--accent); }
      .mix-remove { border: 0; background: transparent; color: var(--danger); font-size: 13px; padding: 6px 8px; }

      /* ---------- Sim ---------- */
      .slider-row { padding: 10px 0; border-bottom: 1px solid var(--border); }
      .slider-row:last-child { border-bottom: 0; }
      .slider-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; font-size: 14px; }
      .slider-head .val { font-weight: 700; white-space: nowrap; }
      input[type="range"] { width: 100%; accent-color: var(--accent); min-height: 2.25rem; }
      .sim-compare { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: end; margin: 6px 0 4px; }
      .sim-compare .amt { font-size: 24px; font-weight: 800; line-height: 1.2; }
      .sim-arrow { color: var(--dim); font-size: 18px; padding-bottom: 4px; }
      .cmp-row { padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 14px; }
      .cmp-row:last-child { border-bottom: 0; }
      .cmp-bars { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 6px; }
      .cmp-bar-track { height: 8px; background: var(--surface-2); border-radius: 4px; overflow: hidden; }
      .cmp-bar-fill { height: 100%; }

      /* ---------- FIRE ---------- */
      .fire-grid { display: grid; gap: 16px; }
      @media (min-width: 640px) { .fire-grid { grid-template-columns: 1fr 1fr; } }
      .fire-stat-label { font-size: 13px; font-weight: 700; color: var(--dim); }
      .fire-big { font-size: 30px; font-weight: 800; line-height: 1.25; }
      .fire-mid { font-size: 19px; font-weight: 800; line-height: 1.3; }
      .switch-row { display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 500; padding: 6px 0; }
      .switch-row input[type="checkbox"] { width: 22px; height: 22px; accent-color: var(--accent); flex: 0 0 auto; }

      .snap-list { list-style: none; margin: 12px 0 0; padding: 0; }
      .snap-list li { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--border); }
      .snap-list li:last-child { border-bottom: 0; }
      .msg-ok { color: var(--green); font-size: 14px; margin-top: 12px; }
      .msg-err { color: var(--danger); font-size: 14px; margin-top: 12px; }
      .btn-row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
      .hidden { display: none !important; }
      svg text { font-family: inherit; }
    </style>
  </head>
  <body>
    <header class="topbar">
      <nav class="topbar-inner" aria-label="メインタブ" id="topTabs"></nav>
    </header>
    <main class="wrap">
      <div id="view"></div>
    </main>
    <nav class="bottomnav" aria-label="メインタブ" id="bottomTabs"></nav>

    <script>
    "use strict";
    /* =====================================================================
       資産ダッシュボード（公開版）
       Single-file build: all data lives in this browser's localStorage.
       JSON export/import format is version 1 — identical to the Muse
       (server-backed) edition, so files move both ways.
       ===================================================================== */

    // ------------------------------------------------------------------
    // Constants (ported from the original finance module)
    // ------------------------------------------------------------------
    var ASSET_CLASSES = ["株式","債券","不動産","コモディティ","現金","暗号資産","年金","その他"];
    var CURRENCIES = ["JPY","USD","EUR","GBP","AUD","その他"];
    var SECTORS = ["テクノロジー","ヘルスケア","金融","消費財","エネルギー","素材","公益事業","不動産","通信","資本財","債券","コモディティ","現金","暗号資産","分散","その他"];
    var FIELD_SECTORS = ["テクノロジー","通信","ヘルスケア","金融","消費財","資本財","エネルギー","素材","公益事業","不動産","債券","コモディティ","現金","暗号資産","その他"];

    var CLASS_COLORS = {
      "株式":"#527ca3","債券":"#8fb0d1","不動産":"#c9a36a","コモディティ":"#d3ab3e",
      "現金":"#9dbe97","暗号資産":"#cf7d88","年金":"#7ba05b","その他":"#aeb4ba",
      "テクノロジー":"#527ca3","通信":"#5fa39a","ヘルスケア":"#74a95e","金融":"#7d9fc4",
      "消費財":"#d98a94","資本財":"#8496ab","エネルギー":"#df9c4a","素材":"#b08d63",
      "公益事業":"#a8c69f","分散":"#9aa7b1",
      "JPY":"#7ba05b","USD":"#527ca3","EUR":"#8d84b8","GBP":"#c08d4e","AUD":"#5fa39a"
    };
    var PALETTE = ["#527ca3","#7ba05b","#d98a94","#8fb0d1","#c9a36a","#a8c69f","#df9c4a","#5fa39a","#8496ab","#b08d63","#8d84b8","#aeb4ba"];
    function colorFor(name, index) {
      return CLASS_COLORS[name] || PALETTE[(index || 0) % PALETTE.length];
    }

    var DEFAULT_TARGETS = {"株式":60,"債券":10,"不動産":5,"コモディティ":5,"現金":10,"暗号資産":5,"年金":5,"その他":0};
    var DEFAULT_FIRE = {
      currentAge: 32, monthlySaving: 210000, annualReturnPct: 4,
      annualSpending: 0, sideIncome: 0, withdrawalRatePct: 4,
      inflationPct: 0, crashEnabled: false, crashDropPct: 30
    };

    var CRASH_SCENARIOS = [
      { id:"lehman", name:"リーマンショック級",
        note:"2008年世界金融危機のピーク→底の下落率を目安にした想定",
        drops:{"株式":50,"債券":10,"不動産":55,"コモディティ":20,"現金":0,"暗号資産":75,"年金":35} },
      { id:"it", name:"ITバブル崩壊級",
        note:"2000〜2002年の下落を目安にした想定（ハイテク中心に大きく下落）",
        drops:{"株式":45,"債券":0,"不動産":25,"コモディティ":10,"現金":0,"暗号資産":80,"年金":30} },
      { id:"corona", name:"コロナショック級",
        note:"2020年2〜3月の急落を目安にした想定",
        drops:{"株式":30,"債券":5,"不動産":35,"コモディティ":15,"現金":0,"暗号資産":50,"年金":20} }
    ];

    // ------------------------------------------------------------------
    // Classification by product name
    // ------------------------------------------------------------------
    function includesAny(n, words) { return words.some(function(w){ return n.indexOf(w) >= 0; }); }
    var CLASSIFY_RULES = [
      { words:["ビットコイン","イーサリアム","暗号資産","仮想通貨","BTC","ETH","リップル","XRP"],
        result:{ assetClass:"暗号資産", currency:"その他", sector:"暗号資産" } },
      { words:["企業型DC","iDeCo","イデコ","確定拠出年金","企業年金","DC"],
        result:{ assetClass:"年金", currency:"JPY", sector:"分散" } },
      { words:["預金","普通預金","定期","現金","MRF","MMF","国債","個人向け国債"],
        result:{ assetClass:"現金", currency:"JPY", sector:"現金" } },
      { words:["ゴールド","金","GLD","GLDM","IAU","コモディティ","原油","プラチナ","銀"],
        result:{ assetClass:"コモディティ", currency:"USD", sector:"コモディティ" } },
      { words:["REIT","リート","不動産","1343"],
        result:{ assetClass:"不動産", currency:"JPY", sector:"不動産" } },
      { words:["AGG","BND","BNDX","債券","TLT"],
        result:{ assetClass:"債券", currency:"USD", sector:"債券" } },
      { words:["ナスダック","NASDAQ","QQQ","S&P","Ｓ＆Ｐ","VYM","VOO","VTI","VT","米国","アメリカ","ダウ","NYダウ"],
        result:{ assetClass:"株式", currency:"USD", sector:"分散" } },
      { words:["VGK","欧州","ヨーロッパ","ユーロ"],
        result:{ assetClass:"株式", currency:"EUR", sector:"分散" } },
      { words:["VEA","先進国","全世界","オールカントリー","オルカン","MSCI","ACWI","2559","2513"],
        result:{ assetClass:"株式", currency:"USD", sector:"分散" } },
      { words:["新興国","VWO","エマージング"],
        result:{ assetClass:"株式", currency:"USD", sector:"分散" } },
      { words:["TOPIX","日経","日本株","1306"],
        result:{ assetClass:"株式", currency:"JPY", sector:"分散" } },
      { words:["テクノロジー","半導体","情報技術","SOXX"],
        result:{ assetClass:"株式", currency:"USD", sector:"テクノロジー" } },
      { words:["ヘルスケア","医療","バイオ"],
        result:{ assetClass:"株式", currency:"USD", sector:"ヘルスケア" } },
      { words:["金融","銀行"],
        result:{ assetClass:"株式", currency:"USD", sector:"金融" } }
    ];
    function classify(name) {
      var normalized = String(name || "").toUpperCase().replace(/\s+/g, "");
      for (var i = 0; i < CLASSIFY_RULES.length; i++) {
        var rule = CLASSIFY_RULES[i];
        if (includesAny(normalized, rule.words) || includesAny(String(name || ""), rule.words)) {
          var out = { assetClass: rule.result.assetClass, currency: rule.result.currency, sector: rule.result.sector };
          if (normalized.indexOf("外貨") >= 0 && out.assetClass === "現金") {
            out.currency = (normalized.indexOf("ユーロ") >= 0 || normalized.indexOf("EUR") >= 0) ? "EUR" : "USD";
          }
          if (out.assetClass === "現金" && (normalized.indexOf("ドル") >= 0 || normalized.indexOf("USD") >= 0)) {
            out.currency = "USD";
          }
          return out;
        }
      }
      return { assetClass:"その他", currency:"JPY", sector:"その他" };
    }

    // ------------------------------------------------------------------
    // Sector (field) mix estimation
    // ------------------------------------------------------------------
    var MIX_WORLD = {"テクノロジー":24,"通信":8,"ヘルスケア":11,"金融":15,"消費財":15,"資本財":10,"エネルギー":4,"素材":4,"公益事業":3,"不動産":2,"その他":4};
    var MIX_SP500 = {"テクノロジー":30,"通信":9,"ヘルスケア":12,"金融":13,"消費財":14,"資本財":8,"エネルギー":4,"素材":2,"公益事業":2,"不動産":2,"その他":4};
    var MIX_NASDAQ100 = {"テクノロジー":50,"通信":15,"消費財":15,"ヘルスケア":5,"資本財":5,"その他":10};
    var MIX_DIVIDEND = {"金融":20,"ヘルスケア":15,"消費財":15,"エネルギー":10,"資本財":10,"テクノロジー":8,"公益事業":5,"素材":5,"通信":3,"その他":9};
    var MIX_DEVELOPED = {"テクノロジー":25,"通信":8,"ヘルスケア":12,"金融":15,"消費財":14,"資本財":10,"エネルギー":4,"素材":4,"公益事業":3,"不動産":2,"その他":3};
    var MIX_EMERGING = {"金融":22,"テクノロジー":20,"消費財":15,"通信":10,"資本財":6,"素材":8,"エネルギー":6,"ヘルスケア":4,"公益事業":2,"不動産":2,"その他":5};
    var MIX_JAPAN = {"資本財":18,"テクノロジー":15,"消費財":16,"金融":12,"通信":8,"ヘルスケア":8,"素材":7,"公益事業":3,"不動産":3,"エネルギー":2,"その他":8};

    function estimateSectorMix(name, cls) {
      var n = String(name || "").toUpperCase().replace(/\s+/g, "");

        '<text x="' + cx + '" y="' + (cy - 2) + '" text-anchor="middle" font-size="17" font-weight="800" fill="var(--text)" class="num">' + esc(centerMain) + "</text>" +
        '<text x="' + cx + '" y="' + (cy + 18) + '" text-anchor="middle" font-size="10.5" fill="var(--dim)">' + esc(centerSub) + "</text></svg>";
    }
    function sliceListHTML(slices) {
      if (slices.length === 0) return "";
      var max = Math.max.apply(null, slices.map(function(s){ return s.pct; }).concat([0]));
      return '<ul class="slice-list">' + slices.map(function(s, i) {
        return "<li>" +
          '<div class="slice-head"><span class="dot" style="background:' + colorFor(s.name, i) + '"></span>' +
          '<span class="slice-name">' + esc(s.name) + '</span>' +
          '<span class="slice-val num">' + fmtYen(s.value) + "</span>" +

          '<div class="bar-track"><div class="bar-fill" style="background:' + colorFor(s.name, i) + ";width:" +
            (max > 0 ? (s.pct / max * 100).toFixed(1) : 0) + '%"></div></div></li>';
      }).join("") + "</ul>";
    }
    /** Multi-series line chart. series: [{label,color,dash,points:[{x,y}]}] */
    function lineChartSVG(series, xLabelEvery, yFmt, height) {
      var W = 640, H = height || 240, padL = 74, padR = 10, padT = 12, padB = 26;
      var allX = [], allY = [];
      series.forEach(function(sr) { sr.points.forEach(function(p) { allX.push(p.x); if (Number.isFinite(p.y)) allY.push(p.y); }); });
      if (allX.length === 0 || allY.length === 0) return "";
      var xMin = Math.min.apply(null, allX), xMax = Math.max.apply(null, allX);
      var yMin = Math.min.apply(null, allY.concat([0])), yMax = Math.max.apply(null, allY);
      if (yMax <= yMin) yMax = yMin + 1;
      var yPad = (yMax - yMin) * 0.08; yMax += yPad; if (yMin > 0) yMin = Math.max(0, yMin - yPad);
      function X(x) { return padL + (xMax === xMin ? 0.5 : (x - xMin) / (xMax - xMin)) * (W - padL - padR); }
      function Y(y) { return padT + (1 - (y - yMin) / (yMax - yMin)) * (H - padT - padB); }
      var out = '<svg viewBox="0 0 ' + W + " " + H + '" style="width:100%;height:auto;display:block" role="img" aria-label="推移グラフ">';
      for (var gi = 0; gi <= 3; gi++) {
        var gy = yMin + (yMax - yMin) * gi / 3;
        out += '<line x1="' + padL + '" x2="' + (W - padR) + '" y1="' + Y(gy) + '" y2="' + Y(gy) + '" stroke="var(--border)" stroke-dasharray="3 3"/>' +
          '<text x="' + (padL - 6) + '" y="' + (Y(gy) + 4) + '" text-anchor="end" font-size="11" fill="var(--dim)" class="num">' + esc(yFmt(gy)) + "</text>";
      }
      var step = Math.max(1, Math.round((xMax - xMin) / 6));
      for (var xv = xMin; xv <= xMax; xv += step) {
        out += '<text x="' + X(xv) + '" y="' + (H - 6) + '" text-anchor="middle" font-size="11" fill="var(--dim)" class="num">' + esc(xLabelEvery(xv)) + "</text>";
      }
      series.forEach(function(sr) {
        var d = "";
        sr.points.forEach(function(p) {
          if (!Number.isFinite(p.y)) return;
          d += (d === "" ? "M" : "L") + X(p.x).toFixed(1) + " " + Y(p.y).toFixed(1) + " ";
        });
        if (d) out += '<path d="' + d + '" fill="none" stroke="' + sr.color + '" stroke-width="2.2" ' +
          (sr.dash ? 'stroke-dasharray="6 4"' : "") + ' stroke-linejoin="round"/>';
        sr.points.forEach(function(p) {
          if (!Number.isFinite(p.y)) return;
          out += '<circle cx="' + X(p.x).toFixed(1) + '" cy="' + Y(p.y).toFixed(1) + '" r="2.4" fill="' + sr.color + '"/>';
        });
      });
      out += "</svg>";
      var legend = series.map(function(sr) {
        return '<span style="display:inline-flex;align-items:center;gap:6px;margin-right:14px;font-size:12.5px;color:var(--dim)">' +
          '<span style="display:inline-block;width:16px;border-top:3px ' + (sr.dash ? "dashed" : "solid") + " " + sr.color + '"></span>' + esc(sr.label) + "</span>";
      }).join("");
      return out + '<div style="margin-top:6px">' + legend + "</div>";
    }

      return '<span class="num">' + esc(m[1]) + '</span><span style="font-size:0.42em;font-weight:700;margin-left:2px">' + esc(m[2]) + "</span>";

            "</div></li>";
        }).join("") + "</ul>" +
        '<p class="num" style="margin:14px 0 0;font-size:14px">合計 <b style="font-size:17px">' + fmtYenFull(totalOf(holdings)) + "</b>（" + holdings.length + "件）</p>";
      }
      html += "</section>";
      html += targetsHTML();
      html += "</div>";
      return html;
    }
    function targetsHTML() {
      var holdings = state.assets;
      var byClass = aggregate(holdings, "assetClass");
      var curMap = {}; byClass.forEach(function(s){ curMap[s.name] = s.pct; });
      var sum = ASSET_CLASSES.reduce(function(s,c){ return s + (Number(state.targets[c]) || 0); }, 0);
      var rows = ASSET_CLASSES.map(function(c, i) {
        return '<div class="target-row">' +
          '<span class="target-label"><span class="dot" style="background:' + colorFor(c, i) + '"></span>' + esc(c) + "</span>" +
          '<span class="target-current num">現在 ' + fmtPct(curMap[c] || 0) + "</span>" +
          '<span class="target-input-wrap"><input class="target-input num" type="text" inputmode="decimal" data-target="' + esc(c) +
            '" value="' + (state.targets[c] == null ? "" : state.targets[c]) + '" aria-label="目標配分 ' + esc(c) + '"><span class="target-unit">%</span></span>' +
        "</div>";
      }).join("");
      return '<section class="card"><h2>目標配分とリバランス提案</h2>' + rows +
        '<p class="num" style="margin:12px 0 0;font-size:14px" id="targetSum">' + targetSumInner() + "</p>" +
        '<div id="rebalanceBox">' + rebalanceHTML() + "</div></section>";
    }
    function targetSumInner() {
      var sum = ASSET_CLASSES.reduce(function(s,c){ return s + (Number(state.targets[c]) || 0); }, 0);
      return "目標の合計：<b>" + fmtPct(sum) + "</b>" +
        (Math.abs(sum - 100) > 0.05 ? ' <span class="dim">（100%でなくても、下の提案は比率に換算して計算します）</span>' : "");
    }
    function rebalanceHTML() {
      var holdings = state.assets;
      if (holdings.length === 0) return '<p class="dim" style="font-size:14px;margin:10px 0 0">資産を登録すると、目標配分との差から買い増し・減らす目安を表示します。</p>';
      var total = totalOf(holdings);
      var byClass = aggregate(holdings, "assetClass");
      var curMap = {}; byClass.forEach(function(s){ curMap[s.name] = s.value; });
      var sum = ASSET_CLASSES.reduce(function(s,c){ return s + (Number(state.targets[c]) || 0); }, 0);
      if (sum <= 0) return '<p class="dim" style="font-size:14px;margin:10px 0 0">目標配分を入力すると提案を表示します。</p>';
      var rows = ASSET_CLASSES.map(function(c, i) {
        var targetVal = total * (Number(state.targets[c]) || 0) / sum;
        var diff = targetVal - (curMap[c] || 0);
        return { name: c, idx: i, diff: diff };
      }).filter(function(r){ return Math.abs(r.diff) >= 10000; })
        .sort(function(a,b){ return Math.abs(b.diff) - Math.abs(a.diff); });
      if (rows.length === 0) return '<p style="font-size:14px;margin:10px 0 0">現在の配分は目標にほぼ沿っています（差が1万円未満のクラスだけです）。</p>';
      return '<ul class="slice-list" style="margin-top:8px">' + rows.map(function(r) {
        var buy = r.diff > 0;
        return "<li><div class=\"slice-head\">" +
          '<span class="dot" style="background:' + colorFor(r.name, r.idx) + '"></span>' +
          '<span class="slice-name">' + esc(r.name) + "</span>" +
          '<span class="pill" style="background:' + (buy ? "var(--green-soft)" : "var(--pink-soft)") + ";color:" + (buy ? "var(--green)" : "var(--danger)") + '">' + (buy ? "買い増し目安" : "減らす目安") + "</span>" +
          '<span class="slice-val num">' + fmtYen(Math.abs(r.diff)) + "</span></div></li>";
      }).join("") + "</ul>" +
      '<p class="note" style="margin-top:10px">総資産は変えずに目標比率へ寄せる場合の金額です。実際の売買判断は手数料・税金も含めてご検討ください。</p>';
    }
    function refreshMixEstimate() {
      if (!formState || !formState.mode || formState.mixTouched) return;
      var nameEl = document.getElementById("fName");
      var name = nameEl ? nameEl.value : "";
      formState.mix = estimateSectorMix(name, formState.cls);
      // Update only the mix editor block — never the whole view — so the
      // caret in the name field and scroll position stay exactly put.
      var box = document.getElementById("mixEditor");
      if (box) { box.innerHTML = mixEditorInnerHTML(); bindMix(); }
    }
    function bindMix() {
      document.querySelectorAll("[data-mix]").forEach(function(inp) {
        inp.addEventListener("input", function() { if (formState) formState.mixTouched = true; });
      });
      document.querySelectorAll("[data-mix-add]").forEach(function(btn) {
        btn.addEventListener("click", function() {
          if (!formState || !formState.mode) return;
          captureMixInputs();
          formState.mixTouched = true;
          formState.mix[btn.getAttribute("data-mix-add")] = 10;
          var box = document.getElementById("mixEditor");
          if (box) { box.innerHTML = mixEditorInnerHTML(); bindMix(); }
        });
      });
      document.querySelectorAll("[data-mix-remove]").forEach(function(btn) {
        btn.addEventListener("click", function() {
          if (!formState || !formState.mode) return;
          captureMixInputs();
          formState.mixTouched = true;
          delete formState.mix[btn.getAttribute("data-mix-remove")];
          var box = document.getElementById("mixEditor");
          if (box) { box.innerHTML = mixEditorInnerHTML(); bindMix(); }
        });
      });
    }
    function captureMixInputs() {
      if (!formState) return;
      document.querySelectorAll("[data-mix]").forEach(function(inp) {
        var w = parseDecimal(inp.value);
        if (w !== null) formState.mix[inp.getAttribute("data-mix")] = w;
      });
    }
    function saveAssetFromForm() {
      var nameEl = document.getElementById("fName");
      var valEl = document.getElementById("fValue");
      var name = (nameEl.value || "").trim();
      var value = parseAmount(valEl.value);
      if (!name) { formState.error = "商品名を入力してください。"; render(); return; }
      if (value === null) { formState.error = "金額を読み取れませんでした。数字、または「300万」の形式で入力してください。"; render(); return; }
      // Read mix inputs (raw strings kept in DOM until now)
      var mix = {};
      document.querySelectorAll("[data-mix]").forEach(function(inp) {
        var w = parseDecimal(inp.value);
        if (w !== null && w > 0) mix[inp.getAttribute("data-mix")] = w;
      });
      var weights = formState.mixTouched ? mix : formState.storedWeights;
      var data = {
        name: name, assetClass: formState.cls.assetClass, currency: formState.cls.currency,
        sector: formState.cls.sector, sectorWeights: weights, valueJpy: value
      };
      if (formState.mode === "edit") {
        var idx = state.assets.findIndex(function(a){ return a.id === formState.id; });
        if (idx >= 0) state.assets[idx] = Object.assign({}, state.assets[idx], data);
      } else {
        state.assets.push(Object.assign({ id: newId() }, data));
      }
      formState = null;
      saveState();
      render();
    }

    // ------------------------------------------------------------------
    // Simulate view （暴落・為替）
    // ------------------------------------------------------------------
    var simState = { mode: "scenario", scenarioId: "lehman", uniformPct: 30, custom: null, yenMove: 20 };
    function simResult() {
      var holdings = state.assets;
      if (simState.mode === "scenario") {
        var sc = CRASH_SCENARIOS.find(function(s){ return s.id === simState.scenarioId; }) || CRASH_SCENARIOS[0];
        return { label: sc.name, result: applyDrops(holdings, function(h){ return sc.drops[h.assetClass] || 0; }) };
      }
      if (simState.mode === "uniform") {
        var p = simState.uniformPct;
        return { label: "一律 −" + p + "%（現金は除く）", result: applyDrops(holdings, function(h){ return h.assetClass === "現金" ? 0 : p; }) };
      }
      if (simState.mode === "custom") {
        var cust = simState.custom || {};
        return { label: "クラス別カスタム", result: applyDrops(holdings, function(h){ return Number(cust[h.assetClass]) || 0; }) };
      }
      var ym = simState.yenMove;
      return { label: ym > 0 ? "円高 +" + ym + "%" : ym < 0 ? "円安 " + ym + "%" : "為替変動なし",
               result: applyDrops(holdings, function(h){ return h.currency === "JPY" ? 0 : ym; }) };
    }
    function sliderRowHTML(label, key, value, min, max) {
      return '<div class="slider-row"><div class="slider-head"><span>' + esc(label) + '</span>' +
        '<span class="val num" id="sv-' + key + '">' + value + '%</span></div>' +
        '<input type="range" min="' + min + '" max="' + max + '" step="1" value="' + value + '" data-slider="' + key + '" aria-label="' + esc(label) + '"></div>';
    }
    function simulateHTML() {
      var holdings = state.assets;
      var modes = [
        { id: "scenario", label: "過去の暴落" }, { id: "uniform", label: "一律下落" },
        { id: "custom", label: "クラス別カスタム" }, { id: "fx", label: "為替" }
      ];

      if (holdings.length === 0) {
        html += '<p class="dim" style="font-size:14px;margin:0">資産を登録すると、暴落や為替変動の影響を試算できます。</p></section></div>';

      }
      html += '<div class="chips" role="tablist" aria-label="シミュレーションの種類">' + modes.map(function(m) {

      }).join("") + "</div>";
      html += '<div style="margin-top:10px">';
      if (simState.mode === "scenario") {
        html += '<div class="chips">' + CRASH_SCENARIOS.map(function(sc) {
          return '<button type="button" class="chip" data-sim-scenario="' + sc.id + '" aria-pressed="' + (simState.scenarioId === sc.id) + '">' + sc.name + "</button>";
        }).join("") + "</div>";
        var sc2 = CRASH_SCENARIOS.find(function(s){ return s.id === simState.scenarioId; });
        if (sc2) html += '<p class="note" style="margin:10px 0 0">' + esc(sc2.note) + "（下落率はクラス別の目安で、実際の値動きとは異なります）</p>";
      } else if (simState.mode === "uniform") {
        html += sliderRowHTML("一律の下落率（現金は除く）", "uniform", simState.uniformPct, 0, 80);
      } else if (simState.mode === "custom") {
        if (!simState.custom) {
          simState.custom = {};
          var base = CRASH_SCENARIOS[2].drops;
          ASSET_CLASSES.forEach(function(c){ simState.custom[c] = base[c] || 0; });
        }
        var present = aggregate(holdings, "assetClass").map(function(s){ return s.name; });
        html += present.map(function(c) {
          return sliderRowHTML(c + "の下落率", "custom:" + c, Number(simState.custom[c]) || 0, 0, 95);
        }).join("");
      } else if (simState.mode === "fx") {
        html += '<div class="slider-row"><div class="slider-head"><span>円の変動（＋は円高／−は円安）</span>' +
          '<span class="val num" id="sv-yen">' + (simState.yenMove > 0 ? "円高 " + simState.yenMove + "%" : simState.yenMove < 0 ? "円安 " + (-simState.yenMove) + "%" : "変動なし") + "</span></div>" +
          '<input type="range" min="-50" max="50" step="1" value="' + simState.yenMove + '" data-slider="yen" aria-label="円の変動率"></div>' +
          '<p class="note" style="margin:8px 0 0">外貨建て資産（JPY以外）の円換算額が、円の変動と同じ割合で増減する簡易試算です。円安の場合は資産が増える方向に表示されます。</p>';
      }
      html += "</div>";
      html += '<div id="simResult" style="margin-top:18px;border-top:1px solid var(--border);padding-top:18px"></div>';
      html += "</section></div>";
      return html;
    }
    function updateSimResult() {
      var box = document.getElementById("simResult");
      if (!box) return;
      var r = simResult();
      var res = r.result;
      var down = res.loss >= 0;
      var maxBefore = Math.max.apply(null, res.byClass.map(function(c){ return c.before; }).concat([1]));
      var html = '<p class="small" style="font-weight:700;color:var(--dim);margin:0">' + esc(r.label) + " の場合</p>" +
        '<div class="sim-compare">' +

          '<div class="sim-arrow">→</div>' +
          '<div><p class="small dim" style="margin:0 0 2px">シミュレーション後</p><p class="amt num" style="margin:0;color:' + (down ? "var(--danger)" : "var(--green)") + '">' + fmtYen(res.after) + "</p></div>" +
        "</div>" +

      html += '<div style="margin-top:14px">' + res.byClass.map(function(c, i) {

          '<span class="num" style="margin-left:auto">' + fmtYen(c.before) + " → <b>" + fmtYen(c.after) + "</b></span>" +

      box.innerHTML = html;

    function dataHTML() {
      var snaps = state.snapshots;
      var html = '<div class="stack"><section class="card"><h2>資産の推移</h2>';
      if (snaps.length === 0) {
        html += '<p class="dim" style="font-size:14px;line-height:1.8;margin:0">まだ記録がありません。概要タブの「今の資産を記録する」を押すと、その時点の総資産と内訳がここに残り、推移グラフが描かれます。</p>';
      } else {
        if (snaps.length >= 2) {
          var series = [{ label: "総資産", color: "#5b7fa6", points: snaps.map(function(s, i){ return { x: i, y: s.totalJpy }; }) }];
          html += lineChartSVG(series, function(x) {
            var s = snaps[Math.round(x)];
            return s ? new Date(s.recordedAt).toLocaleDateString("ja-JP", { year: "2-digit", month: "numeric", day: "numeric" }) : "";
          }, function(v){ return fmtYen(v); }, 220);
        } else {
          html += '<p class="dim" style="font-size:14px;margin:0">記録が2件以上になると推移グラフが表示されます。</p>';
        }
        html += '<ul class="snap-list">' + snaps.slice().reverse().map(function(s) {
          var bd = Object.keys(s.breakdown).map(function(k){ return k + " " + fmtYen(s.breakdown[k]); }).join(" ・ ");
          var confirming = formState && formState.deleteSnapId === s.id;
          return "<li><div style=\"min-width:0\"><p style=\"margin:0;font-size:14px;font-weight:500\">" +
            esc(new Date(s.recordedAt).toLocaleString("ja-JP")) + "</p>" +
            (bd ? '<p class="note" style="margin:2px 0 0">' + esc(bd) + "</p>" : "") + "</div>" +
            '<div style="display:flex;align-items:center;gap:8px;flex-shrink:0"><span class="num" style="font-size:16px;font-weight:800">' + fmtYen(s.totalJpy) + "</span>" +
            (confirming
              ? '<button type="button" class="btn-danger" data-action="delete-snapshot" data-id="' + s.id + '">削除する</button><button type="button" class="btn-ghost" data-action="cancel-delete">やめる</button>'
              : '<button type="button" class="btn-ghost" data-action="ask-delete-snap" data-id="' + s.id + '" aria-label="記録を削除">削除</button>') +
            "</div></li>";
        }).join("") + "</ul>";
      }
      html += "</section>";
      html += '<section class="card"><h2>データの書き出し・読み込み</h2>' +
        '<p class="dim" style="font-size:14px;line-height:1.8;margin:0">資産・記録・目標配分・FIREの条件を、まとめてJSONファイルに書き出せます。Muse上の資産ダッシュボードで書き出したJSONも、そのまま読み込めます（形式は共通です）。読み込むと現在のデータは置き換わります。</p>' +
        '<div class="btn-row"><button type="button" class="btn-primary" data-action="export-json">JSONを書き出す</button>' +
        '<button type="button" class="btn-ghost" data-action="import-json">JSONを読み込む</button>' +
        '<input type="file" id="importFile" accept="application/json,.json" class="hidden" aria-label="読み込むJSONファイル"></div>' +
        '<p class="msg-ok' + (importNotice && importNotice.ok ? '' : ' hidden') + '" id="dataOk" role="status">' + (importNotice && importNotice.ok ? esc(importNotice.ok) : '') + '</p>' +
        '<p class="msg-err' + (importNotice && importNotice.err ? '' : ' hidden') + '" id="dataErr" role="alert">' + (importNotice && importNotice.err ? esc(importNotice.err) : '') + '</p>' +
        (importNotice && importNotice.ok ? '<div class="btn-row"><button type="button" class="btn-primary" data-action="go-dashboard">概要で総資産を確認する</button><button type="button" class="btn-ghost" data-action="go-assets">資産一覧を見る</button></div>' : '') +
        '<p class="note divider-note">データはこの端末のブラウザ内にだけ保存されます。機種変更やブラウザのデータ消去に備えて、ときどきJSONで書き出しておくのがおすすめです。</p></section>';
      html += "</div>";
      return html;
    }
    function exportJSON() {
      var data = {
        version: 1,
        exportedAt: new Date().toISOString(),
        assets: state.assets.map(function(h) {
          return { name: h.name, assetClass: h.assetClass, currency: h.currency, sector: h.sector, sectorWeights: h.sectorWeights, valueJpy: h.valueJpy };
        }),
        snapshots: state.snapshots.map(function(s) {
          return { totalJpy: s.totalJpy, breakdown: s.breakdown, recordedAt: s.recordedAt };
        }),
        targets: state.targets,
        fire: state.fire
      };
      var blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url;
      a.download = "asset-dashboard-" + new Date().toISOString().slice(0, 10) + ".json";
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
    }
    function importContainers(parsed) {
      var out = [];
      if (!parsed || typeof parsed !== "object") return out;
      out.push(parsed);
      ["data","export","state","backup","result","payload"].forEach(function(k) {
        if (parsed[k] && typeof parsed[k] === "object" && !Array.isArray(parsed[k])) out.push(parsed[k]);
      });
      return out;
    }
    function findImportedArray(parsed, keys) {
      if (Array.isArray(parsed) && keys.indexOf("assets") >= 0) return { list: parsed, key: "(配列)" };
      var containers = importContainers(parsed);
      for (var ci = 0; ci < containers.length; ci++) {
        for (var ki = 0; ki < keys.length; ki++) {
          var v = containers[ci][keys[ki]];
          if (Array.isArray(v)) return { list: v, key: keys[ki] };
        }
      }
      return null;
    }
    function findImportedObject(parsed, keys) {
      var containers = importContainers(parsed);
      for (var ci = 0; ci < containers.length; ci++) {
        for (var ki = 0; ki < keys.length; ki++) {
          var v = containers[ci][keys[ki]];
          if (v && typeof v === "object" && !Array.isArray(v)) return v;
        }
      }
      return null;
    }
    function importJSONData(parsed) {
      // Double-encoded JSON (a JSON string containing JSON) — unwrap once.
      if (typeof parsed === "string") {
        try { parsed = JSON.parse(parsed); } catch (e) { return { error: "JSONとして読み取れませんでした。書き出したファイルを選んでください。現在のデータは変更していません。" }; }
      }
      if (!parsed || typeof parsed !== "object") return { error: "JSONの内容が空、または形式が想定と違います。現在のデータは変更していません。" };
      var found = findImportedArray(parsed, ["assets","holdings","items","portfolio","investments","securities","資産"]);
      if (!found) {
        var topKeys = Array.isArray(parsed) ? "(配列)" : Object.keys(parsed).slice(0, 12).join("、");
        return { error: "資産のリストが見つかりませんでした。ファイルに含まれていた項目：" + (topKeys || "なし") + "。資産ダッシュボードで書き出したJSON（assets または holdings の配列を含むもの）を選んでください。現在のデータは変更していません。" };
      }
      var rawList = found.list;
      if (rawList.length === 0) return { error: "資産のリストはありましたが中身が0件でした。もとのアプリで資産が登録された状態で書き出してください。現在のデータは変更していません。" };
      var assets = [], skipped = 0, firstKeys = "";
      rawList.forEach(function(raw, idx) {
        var one = sanitizeAsset(raw);
        if (one) assets.push(one); else { skipped++; if (idx === 0 && raw && typeof raw === "object") firstKeys = Object.keys(raw).slice(0, 12).join("、"); }
      });
      if (assets.length === 0) {
        return { error: "資産リスト（" + rawList.length + "件）は見つかりましたが、1件も読み取れませんでした。各資産に「商品名（name / title など）」と「金額（valueJpy / amount / value など）」が必要です。1件目の項目：" + (firstKeys || "不明") + "。現在のデータは変更していません。" };
      }
      var snapFound = findImportedArray(parsed, ["snapshots","history","records","履歴","記録"]);
      var snaps = [];
      if (snapFound) {
        snaps = snapFound.list.map(function(x) {
          if (!x || typeof x !== "object") return null;
          var totPick = pickField(x, ["totalJpy","totalJPY","total","amount","value","balance","総資産","合計"]);
          var tot = totPick.found ? parseImportedValue(totPick.value) : null;
          if (tot === null) return null;
          var datePick = pickField(x, ["recordedAt","date","createdAt","at","日時","日付"]);
          return { id: newId(), totalJpy: tot,
                   breakdown: (x.breakdown && typeof x.breakdown === "object") ? x.breakdown : {},
                   recordedAt: datePick.found && typeof datePick.value === "string" ? datePick.value : new Date().toISOString() };
        }).filter(Boolean);
      }
      var targets = Object.assign({}, DEFAULT_TARGETS);
      var targetsObj = findImportedObject(parsed, ["targets","targetAllocations","allocations","target","目標配分"]);
      if (targetsObj) {
        Object.keys(targetsObj).forEach(function(k) {
          var v = Number(targetsObj[k]);
          if (ASSET_CLASSES.indexOf(k) >= 0 && Number.isFinite(v)) targets[k] = v;
        });
      }
      var fireObj = findImportedObject(parsed, ["fire","fireSettings","fireConfig"]) || findImportedObject(parsed, ["settings"]);
      state = { assets: assets, snapshots: snaps, targets: targets, fire: sanitizeFire(fireObj) };
      saveState();
      // Verify the save actually landed (guards against blocked storage).
      var persisted = false;
      try { var chk = JSON.parse(localStorage.getItem(LS_KEY) || "{}"); persisted = Array.isArray(chk.assets) && chk.assets.length === assets.length; } catch (e) { persisted = false; }
      return { assets: assets.length, snapshots: snaps.length, skipped: skipped, totalJpy: totalOf(assets), sourceKey: found.key, persisted: persisted };
    }
    function readImportFile(file) {
      if (file && typeof file.text === "function") return file.text();
      return new Promise(function(resolve, reject) {
        try {
          var reader = new FileReader();
          reader.onload = function() { resolve(String(reader.result || "")); };
          reader.onerror = function() { reject(reader.error || new Error("read failed")); };
          reader.readAsText(file);
        } catch (e) { reject(e); }
      });
    }
    function recordSnapshot(feedbackEl) {
      var byClass = aggregate(state.assets, "assetClass");
      var breakdown = {};
      byClass.forEach(function(s){ breakdown[s.name] = s.value; });
      state.snapshots.push({ id: newId(), totalJpy: totalOf(state.assets), breakdown: breakdown, recordedAt: new Date().toISOString() });
      saveState();
      if (feedbackEl) feedbackEl.textContent = "記録しました（「記録・データ」タブで確認できます）";
    }

    // ------------------------------------------------------------------
    // Event binding
    // ------------------------------------------------------------------
    function bindView() {
      // Chips inside the asset form
      document.querySelectorAll("[data-chip-group]").forEach(function(groupEl) {
        var group = groupEl.getAttribute("data-chip-group");
        groupEl.querySelectorAll("[data-chip]").forEach(function(btn) {
          btn.addEventListener("click", function() {
            var v = btn.getAttribute("data-chip");
            formState.cls[group] = v;
            if (group === "assetClass") formState.manualClass = true;
            if (group === "currency") formState.manualCurrency = true;
            if (group === "sector") formState.manualSector = true;
            groupEl.querySelectorAll("[data-chip]").forEach(function(b) {
              b.setAttribute("aria-pressed", b.getAttribute("data-chip") === v ? "true" : "false");
            });
            refreshMixEstimate();
          });
        });
      });
      var nameEl = document.getElementById("fName");
      if (nameEl) {
        nameEl.addEventListener("input", function() {
          if (!formState) return;
          var c = classify(nameEl.value);
          if (!formState.manualClass) formState.cls.assetClass = c.assetClass;
          if (!formState.manualCurrency) formState.cls.currency = c.currency;
          if (!formState.manualSector) formState.cls.sector = c.sector;
          // Reflect chip selection without re-rendering (keeps caret in place)
          [["assetClass", formState.cls.assetClass], ["currency", formState.cls.currency], ["sector", formState.cls.sector]].forEach(function(pair) {
            var g = document.querySelector('[data-chip-group="' + pair[0] + '"]');
            if (g) g.querySelectorAll("[data-chip]").forEach(function(b) {
              b.setAttribute("aria-pressed", b.getAttribute("data-chip") === pair[1] ? "true" : "false");
            });
          });
          refreshMixEstimate();
        });
      }
      bindMix();
      // Target inputs: commit on change (blur/Enter) — typed text is kept
      // untouched while editing; only the rebalance box re-renders.
      document.querySelectorAll("[data-target]").forEach(function(inp) {
        var commitTarget = function() {
          var cls = inp.getAttribute("data-target");
          var v = parseDecimal(inp.value);
          if (v === null) return;
          state.targets[cls] = Math.min(100, Math.max(0, v));
          saveState();
          // Update only the sum + rebalance blocks; the inputs themselves
          // are never re-created, so a value can never land in another row.
          var sumEl = document.getElementById("targetSum");
          if (sumEl) sumEl.innerHTML = targetSumInner();
          var box = document.getElementById("rebalanceBox");
          if (box) box.innerHTML = rebalanceHTML();
        };
        inp.addEventListener("input", commitTarget);
        inp.addEventListener("change", commitTarget);
      });
      // Sim controls
      document.querySelectorAll("[data-sim-mode]").forEach(function(btn) {
        btn.addEventListener("click", function() { simState.mode = btn.getAttribute("data-sim-mode"); render(); });
      });
      document.querySelectorAll("[data-sim-scenario]").forEach(function(btn) {
        btn.addEventListener("click", function() { simState.scenarioId = btn.getAttribute("data-sim-scenario"); render(); });
      });
      document.querySelectorAll("[data-slider]").forEach(function(sl) {
        sl.addEventListener("input", function() {
          var key = sl.getAttribute("data-slider");
          var v = Number(sl.value);
          if (key === "uniform") { simState.uniformPct = v; var o1 = document.getElementById("sv-uniform"); if (o1) o1.textContent = v + "%"; }
          else if (key === "yen") {
            simState.yenMove = v;
            var o2 = document.getElementById("sv-yen");
            if (o2) o2.textContent = v > 0 ? "円高 " + v + "%" : v < 0 ? "円安 " + (-v) + "%" : "変動なし";
          } else if (key.indexOf("custom:") === 0) {
            if (!simState.custom) simState.custom = {};
            simState.custom[key.slice(7)] = v;
            var o3 = document.getElementById("sv-" + key);
            if (o3) o3.textContent = v + "%";
          }
          updateSimResult();
        });
      });
      // FIRE inputs: commit parsed value on input/change without ever
      // rewriting the input's own text, so "4.5" / "300万" never vanish.
      document.querySelectorAll("[data-fire]").forEach(function(inp) {
        var commit = function() {
          var key = inp.getAttribute("data-fire");
          var kind = inp.getAttribute("data-kind");
          var v = kind === "yen" ? parseAmount(inp.value) : parseDecimal(inp.value);
          if (v === null) return;
          if (key === "currentAge") v = Math.min(100, Math.max(0, Math.round(v)));
          state.fire[key] = v;
          saveState();
          updateFireResults();
        };
        inp.addEventListener("input", commit);
        inp.addEventListener("change", commit);
      });
      var crashBox = document.querySelector("[data-fire-crash]");
      if (crashBox) {
        crashBox.addEventListener("change", function() {
          state.fire.crashEnabled = crashBox.checked;
          saveState();
          render(); // re-render shows/hides the crash % field
        });
      }
      var fileEl = document.getElementById("importFile");
      if (fileEl) {
        fileEl.addEventListener("change", function() {
          var file = fileEl.files && fileEl.files[0];
          fileEl.value = "";
          if (!file) return;
          readImportFile(file).then(function(text) {
            var parsed;
            try { parsed = JSON.parse(String(text || "").replace(/^\uFEFF/, "")); } catch (e) {
              showDataMsg(null, "JSONとして読み取れませんでした。書き出したファイルを選んでください。現在のデータは変更していません。");
              return;
            }
            var res = importJSONData(parsed);
            if (res.error) { showDataMsg(null, res.error); return; }
            formState = null;
            var msg = "読み込みが完了しました：資産 " + res.assets + "件（合計 " + fmtYenFull(res.totalJpy) + "）・記録 " + res.snapshots + "件を反映しました。概要タブの総資産と資産一覧に反映されています。";
            if (res.skipped > 0) msg += " ※" + res.skipped + "件は商品名・金額を読み取れず除外しました。";
            if (res.persisted === false) msg += " ※この端末への保存を確認できませんでした。ブラウザの保存が制限されている可能性があります。";
            importNotice = { ok: msg, err: null };
            render();
            showDataMsg(msg, null);
          }).catch(function() {
            showDataMsg(null, "ファイルを読めませんでした。現在のデータは変更していません。");
          });
        });
      }
    }
    function showDataMsg(ok, err) {
      importNotice = { ok: ok || null, err: err || null };
      var okEl = document.getElementById("dataOk");
      var errEl = document.getElementById("dataErr");
      if (okEl) { okEl.textContent = ok || ""; okEl.classList.toggle("hidden", !ok); }
      if (errEl) { errEl.textContent = err || ""; errEl.classList.toggle("hidden", !err); }
    }

    // Delegated actions
    document.addEventListener("click", function(e) {
      var el = e.target.closest("[data-action]");
      if (!el) return;
      var action = el.getAttribute("data-action");
      var id = el.getAttribute("data-id");
      if (action === "go-assets") goTab("assets");
      else if (action === "go-dashboard") goTab("dashboard");
      else if (action === "go-fire") goTab("fire");
      else if (action === "record-snapshot") recordSnapshot(document.getElementById("snapFeedback"));
      else if (action === "add-asset") openForm(null);
      else if (action === "edit-asset") {
        var a = state.assets.find(function(x){ return x.id === id; });
        if (a) openForm(a);
      }
      else if (action === "cancel-form") { formState = null; render(); }
      else if (action === "save-asset") saveAssetFromForm();
      else if (action === "ask-delete") { formState = { deleteId: id }; render(); }
      else if (action === "ask-delete-snap") { formState = { deleteSnapId: id }; render(); }
      else if (action === "cancel-delete") { formState = null; render(); }
      else if (action === "delete-asset") {
        state.assets = state.assets.filter(function(x){ return x.id !== id; });
        formState = null; saveState(); render();
      }
      else if (action === "delete-snapshot") {
        state.snapshots = state.snapshots.filter(function(x){ return x.id !== id; });
        formState = null; saveState(); render();
      }
      else if (action === "export-json") exportJSON();
      else if (action === "import-json") {
        var f = document.getElementById("importFile");
        if (f) f.click();
      }
    });

    // Init
    renderTabs();
    render();
    </script>
  </body>
</html>
