<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:," />
    <title>資産ダッシュボード</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #faf7f0;
        --surface: #ffffff;
        --surface-2: #f6f1e7;
        --text: #2f353b;
        --dim: #6f767e;
        --border: #e7dfcd;
        --accent: #527ca3;
        --accent-strong: #3f6690;
        --accent-soft: #e8eff6;
        --green: #6d9448;
        --green-soft: #eef3e6;
        --pink: #cf7d88;
        --pink-soft: #faedef;
        --amber: #c99a3c;
        --danger: #c0564f;
        --radius: 18px;
        --radius-sm: 12px;
        --shadow-card: 0 1px 2px rgb(90 78 50 / 0.05), 0 8px 24px -12px rgb(90 78 50 / 0.14);
        --shadow-nav: 0 -6px 24px -12px rgb(90 78 50 / 0.22);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1b1f24;
          --surface: #262b31;
          --surface-2: #2d333a;
          --text: #eef1f4;
          --dim: #a3adb6;
          --border: #3a4149;
          --accent: #8fb0d1;
          --accent-strong: #a9c6e2;
          --accent-soft: #2c3844;
          --green: #a5c48a;
          --green-soft: #2e3a28;
          --pink: #e5a7ae;
          --pink-soft: #3d2c2e;
          --amber: #dcb26a;
          --danger: #e08a84;
          --shadow-card: 0 1px 2px rgb(0 0 0 / 0.25), 0 10px 28px -14px rgb(0 0 0 / 0.5);
          --shadow-nav: 0 -6px 24px -12px rgb(0 0 0 / 0.6);
        }
      }

      * { box-sizing: border-box; }
      html {
        /* Stop mobile browsers inflating text (a cause of caret/layout drift). */
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", sans-serif;
        font-size: 16px;
        line-height: 1.55;
        padding-bottom: calc(76px + env(safe-area-inset-bottom));
      }
      @media (min-width: 721px) { body { padding-bottom: 40px; } }

      /* Every form control at 16px+: focusing never triggers iOS auto-zoom. */
      input, select, textarea { font-size: 16px; font-family: inherit; }
      button, [role="button"], select, summary,
      input:not([type="checkbox"], [type="radio"]) { min-height: 2.25rem; }
      button { font-family: inherit; cursor: pointer; transition: background-color 120ms ease, color 120ms ease, border-color 120ms ease; }
      :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

      .num { font-variant-numeric: tabular-nums; font-feature-settings: "tnum" 1; letter-spacing: 0.01em; }
      .wrap { max-width: 880px; margin: 0 auto; padding: 16px 16px 8px; }
      @media (min-width: 721px) { .wrap { padding-top: 24px; } }
      .stack > * + * { margin-top: 20px; }

      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        box-shadow: var(--shadow-card);
        padding: 20px;
      }
      .card h2, .section-title {
        font-size: 17px; font-weight: 700; line-height: 1.35;
        margin: 0 0 16px; letter-spacing: -0.01em;
      }
      .dim { color: var(--dim); }
      .small { font-size: 13px; }
      .note { font-size: 12.5px; line-height: 1.7; color: var(--dim); }
      .divider-note { border-top: 1px solid var(--border); margin-top: 16px; padding-top: 12px; }

      /* ---------- Tabs ---------- */
      .topbar {
        display: none;
        position: sticky; top: 0; z-index: 20;
        background: color-mix(in srgb, var(--bg) 88%, transparent);
        backdrop-filter: blur(8px);
        border-bottom: 1px solid var(--border);
      }
      .topbar-inner { max-width: 880px; margin: 0 auto; padding: 10px 16px; display: flex; gap: 6px; }
      .bottomnav {
        position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
        background: var(--surface);
        border-top: 1px solid var(--border);
        box-shadow: var(--shadow-nav);
        padding-bottom: env(safe-area-inset-bottom);
        display: flex;
      }
      @media (min-width: 721px) {
        .topbar { display: block; }
        .bottomnav { display: none; }
      }
      .tab-btn {
        flex: 1 1 0; border: 0; background: transparent; color: var(--dim);
        font-size: 13px; font-weight: 600; padding: 10px 2px; min-height: 3rem;
        border-radius: 10px; white-space: nowrap;
      }
      .topbar .tab-btn { flex: 0 1 auto; font-size: 14px; padding: 8px 14px; min-height: 2.5rem; }
      .tab-btn[aria-selected="true"] { color: var(--accent-strong); background: var(--accent-soft); }

      /* ---------- Buttons / inputs / chips ---------- */
      .btn-primary {
        border: 0; border-radius: var(--radius-sm); background: var(--accent);
        color: #fff; padding: 10px 16px; font-size: 14px; font-weight: 700;
        box-shadow: 0 4px 12px -6px var(--accent);
      }
      .btn-primary:disabled { opacity: 0.5; }
      .btn-ghost {
        border: 1px solid var(--border); border-radius: var(--radius-sm);
        background: var(--surface); color: var(--text);
        padding: 8px 14px; font-size: 14px; font-weight: 500;
      }
      .btn-ghost:disabled { opacity: 0.5; }
      .btn-danger {
        border: 1px solid var(--border); border-radius: var(--radius-sm);
        background: var(--surface); color: var(--danger);
        padding: 8px 12px; font-size: 14px; font-weight: 500;
      }
      .input {
        width: 100%;
        border: 1px solid var(--border); border-radius: var(--radius-sm);
        background: var(--surface-2); color: var(--text);
        padding: 9px 12px; outline: none;
      }
      .input:focus { border-color: var(--accent); }
      .field { display: block; margin-bottom: 14px; }
      .field > .flabel { display: block; font-size: 14px; font-weight: 500; margin-bottom: 5px; }
      .field .hint { display: block; font-size: 12.5px; color: var(--dim); margin-top: 4px; }

      .chips { display: flex; flex-wrap: wrap; gap: 8px; }
      .chip {
        border: 1px solid var(--border); border-radius: 999px;
        background: var(--surface); color: var(--text);
        padding: 7px 13px; font-size: 14px; font-weight: 500; min-height: 2.25rem;
      }
      .chip[aria-pressed="true"] {
        background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700;
      }
      .chip-green[aria-pressed="true"] { background: var(--green); border-color: var(--green); }

      /* ---------- Lists / slices ---------- */
      .slice-list { list-style: none; margin: 16px 0 0; padding: 0; }
      .slice-list li { padding: 7px 0; }
      .slice-head { display: flex; align-items: baseline; gap: 8px; font-size: 14px; flex-wrap: wrap; }
      .dot { width: 10px; height: 10px; border-radius: 3px; flex: 0 0 10px; align-self: center; }
      .slice-name { font-weight: 500; }
      .slice-val { margin-left: auto; font-weight: 700; white-space: nowrap; }
      .slice-pct { color: var(--dim); font-size: 13px; min-width: 58px; text-align: right; white-space: nowrap; }
      .bar-track { height: 6px; border-radius: 3px; background: var(--surface-2); margin-top: 5px; overflow: hidden; }
      .bar-fill { height: 100%; border-radius: 3px; }

      .donut-flex { display: flex; gap: 20px; align-items: center; flex-wrap: wrap; }
      .donut-flex .slice-list { flex: 1 1 220px; margin-top: 0; }

      .progress-track { height: 10px; border-radius: 5px; background: var(--surface-2); overflow: hidden; }
      .progress-fill { height: 100%; border-radius: 5px; }

      .pill {
        display: inline-flex; align-items: center; border-radius: 999px;
        padding: 4px 10px; font-size: 13px; font-weight: 700;
      }
      .count-badge {
        border-radius: 999px; background: var(--surface-2); color: var(--dim);
        padding: 4px 10px; font-size: 12px; font-weight: 700; white-space: nowrap;
      }

      /* ---------- Asset rows ---------- */
      .asset-list { list-style: none; margin: 0; padding: 0; }
      .asset-list li { padding: 14px 0; border-bottom: 1px solid var(--border); }
      .asset-list li:last-child { border-bottom: 0; padding-bottom: 2px; }
      .asset-top { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
      .asset-name { font-weight: 700; min-width: 0; overflow-wrap: anywhere; }
      .asset-value { margin-left: auto; font-weight: 800; font-size: 17px; white-space: nowrap; }
      .asset-meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 7px; align-items: center; }
      .tag {
        font-size: 12px; font-weight: 600; border-radius: 999px; padding: 3px 9px;
        background: var(--surface-2); color: var(--dim);
      }
      .tag b { color: var(--text); font-weight: 700; }
      .asset-actions { display: flex; gap: 8px; margin-top: 10px; }
      .asset-actions button { padding: 6px 12px; font-size: 13px; }

      /* ---------- Target allocation rows ----------
         One row per class: label / current % / input. The input has a
         single dedicated width rule — no competing width utilities —
         so rows can never overlap or shift (a past bug). */
      .target-row {
        display: flex; align-items: center; gap: 12px;
        padding: 9px 0; border-bottom: 1px solid var(--border);
      }
      .target-row:last-of-type { border-bottom: 0; }
      .target-label { flex: 1 1 auto; min-width: 0; display: flex; align-items: center; gap: 8px; font-weight: 500; font-size: 15px; }
      .target-current { flex: 0 0 74px; text-align: right; color: var(--dim); font-size: 14px; }
      .target-input-wrap { flex: 0 0 96px; width: 96px; display: flex; align-items: center; gap: 5px; }
      .target-input {
        width: 72px; flex: 0 0 72px;
        border: 1px solid var(--border); border-radius: 10px;
        background: var(--surface-2); color: var(--text);
        padding: 8px 10px; text-align: right; outline: none;
      }
      .target-input:focus { border-color: var(--accent); }
      .target-unit { color: var(--dim); font-size: 14px; }

      .mix-row { display: flex; align-items: center; gap: 10px; padding: 6px 0; }
      .mix-name { flex: 1 1 auto; font-size: 14px; display: flex; gap: 8px; align-items: center; min-width: 0; }
      .mix-input-wrap { flex: 0 0 92px; width: 92px; display: flex; align-items: center; gap: 5px; }
      .mix-input {
        width: 68px; flex: 0 0 68px;
        border: 1px solid var(--border); border-radius: 10px;
        background: var(--surface-2); color: var(--text);
        padding: 7px 9px; text-align: right; outline: none;
      }
      .mix-input:focus { border-color: var(--accent); }
      .mix-remove { border: 0; background: transparent; color: var(--danger); font-size: 13px; padding: 6px 8px; }

      /* ---------- Sim ---------- */
      .slider-row { padding: 10px 0; border-bottom: 1px solid var(--border); }
      .slider-row:last-child { border-bottom: 0; }
      .slider-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; font-size: 14px; }
      .slider-head .val { font-weight: 700; white-space: nowrap; }
      input[type="range"] { width: 100%; accent-color: var(--accent); min-height: 2.25rem; }
      .sim-compare { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: end; margin: 6px 0 4px; }
      .sim-compare .amt { font-size: clamp(19px, 5.4vw, 24px); font-weight: 800; line-height: 1.25; overflow-wrap: anywhere; }
      .sim-arrow { color: var(--dim); font-size: 18px; padding-bottom: 4px; }
      .cmp-row { padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 14px; }
      .cmp-row:last-child { border-bottom: 0; }
      .cmp-bars { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 6px; }
      .cmp-bar-track { height: 8px; background: var(--surface-2); border-radius: 4px; overflow: hidden; }
      .cmp-bar-fill { height: 100%; }

      /* ---------- FIRE ---------- */
      .fire-grid { display: grid; gap: 16px; }
      @media (min-width: 640px) { .fire-grid { grid-template-columns: 1fr 1fr; } }
      .fire-stat-label { font-size: 13px; font-weight: 700; color: var(--dim); }
      .fire-big { font-size: clamp(24px, 6.8vw, 30px); font-weight: 800; line-height: 1.25; overflow-wrap: anywhere; }
      .fire-mid { font-size: 19px; font-weight: 800; line-height: 1.3; overflow-wrap: anywhere; }
      .switch-row { display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 500; padding: 6px 0; }
      .switch-row input[type="checkbox"] { width: 22px; height: 22px; accent-color: var(--accent); flex: 0 0 auto; }

      .snap-list { list-style: none; margin: 12px 0 0; padding: 0; }
      .snap-list li { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--border); }
      .snap-list li:last-child { border-bottom: 0; }
      .msg-ok { color: var(--green); font-size: 14px; margin-top: 12px; }
      .msg-err { color: var(--danger); font-size: 14px; margin-top: 12px; }
      .btn-row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
      .hidden { display: none !important; }

      /* ---------- Save status / restore banner ---------- */
      .savebar { max-width: 880px; margin: 0 auto; padding: 10px 16px 0; display: flex; justify-content: flex-end; }
      .save-status { font-size: 12.5px; color: var(--dim); display: inline-flex; align-items: center; gap: 6px; min-height: 1.2em; }
      .save-dot { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 8px; }
      .restore-wrap { padding-bottom: 0; }
      .restore-card { display: flex; gap: 12px; align-items: flex-start; justify-content: space-between; }
      .restore-card .btn-ghost { flex: 0 0 auto; }
      svg text { font-family: inherit; }

      /* ---------- Advice / AI summary ---------- */
      .advice-group { margin-top: 16px; }
      .advice-group:first-of-type { margin-top: 4px; }
      .advice-heading { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 700; margin: 0 0 8px; }
      .advice-dot { width: 10px; height: 10px; border-radius: 50%; flex: 0 0 10px; }
      .advice-list { list-style: none; margin: 0; padding: 0; }
      .advice-list li { display: flex; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--border); font-size: 14px; line-height: 1.75; }
      .advice-list li:last-child { border-bottom: 0; padding-bottom: 2px; }
      .advice-mark { flex: 0 0 auto; width: 22px; height: 22px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 800; margin-top: 2px; }
      .advice-mark-good { background: var(--green-soft); color: var(--green); }
      .advice-mark-warn { background: #fbf0d9; color: #8a6414; }
      @media (prefers-color-scheme: dark) { .advice-mark-warn { background: #3d3423; color: var(--amber); } }
      .summary-preview { margin-top: 14px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface-2); }
      .summary-preview summary { cursor: pointer; padding: 10px 14px; font-size: 14px; font-weight: 600; min-height: 2.25rem; }
      .summary-preview pre { margin: 0; padding: 0 14px 14px; white-space: pre-wrap; overflow-wrap: anywhere; font-family: inherit; font-size: 13px; line-height: 1.8; color: var(--text); max-height: 420px; overflow: auto; }
    </style>
  </head>
  <body>
    <header class="topbar">
      <nav class="topbar-inner" aria-label="メインタブ" id="topTabs"></nav>
    </header>
    <div class="savebar"><span class="save-status" id="saveStatus" role="status"></span></div>
    <div class="wrap restore-wrap hidden" id="restoreBanner"></div>
    <main class="wrap">
      <div id="view"></div>
    </main>
    <nav class="bottomnav" aria-label="メインタブ" id="bottomTabs"></nav>

    <script>
    "use strict";
    /* =====================================================================
       資産ダッシュボード（公開版）
       Single-file build: all data lives in this browser's localStorage.
       JSON export/import format is version 1 — identical to the Muse
       (server-backed) edition, so files move both ways.
       ===================================================================== */

    // ------------------------------------------------------------------
    // Constants (ported from the original finance module)
    // ------------------------------------------------------------------
    var ASSET_CLASSES = ["株式","債券","国債","不動産","コモディティ","現金","暗号資産","年金","その他"];
    var CURRENCIES = ["JPY","USD","EUR","GBP","AUD","その他"];
    var SECTORS = ["テクノロジー","ヘルスケア","金融","消費財","エネルギー","素材","公益事業","不動産","通信","資本財","債券","コモディティ","現金","暗号資産","分散","その他"];
    var FIELD_SECTORS = ["テクノロジー","通信","ヘルスケア","金融","消費財","資本財","エネルギー","素材","公益事業","不動産","債券","コモディティ","現金","暗号資産","その他"];

    var CLASS_COLORS = {
      "株式":"#527ca3","債券":"#8fb0d1","国債":"#5f8d7a","不動産":"#c9a36a","コモディティ":"#d3ab3e",
      "現金":"#9dbe97","暗号資産":"#cf7d88","年金":"#7ba05b","その他":"#aeb4ba",
      "テクノロジー":"#527ca3","通信":"#5fa39a","ヘルスケア":"#74a95e","金融":"#7d9fc4",
      "消費財":"#d98a94","資本財":"#8496ab","エネルギー":"#df9c4a","素材":"#b08d63",

      "JPY":"#7ba05b","USD":"#527ca3","EUR":"#8d84b8","GBP":"#c08d4e","AUD":"#5fa39a",
      "円建て（JPY）":"#7ba05b","ドル建て（USD）":"#527ca3","ユーロ建て（EUR）":"#8d84b8",
      "円（JPY）":"#7ba05b","米ドル（USD）":"#527ca3","ユーロ（EUR）":"#8d84b8"
    };
    var PALETTE = ["#527ca3","#7ba05b","#d98a94","#8fb0d1","#c9a36a","#a8c69f","#df9c4a","#5fa39a","#8496ab","#b08d63","#8d84b8","#aeb4ba"];
    function colorFor(name, index) {
      return CLASS_COLORS[name] || PALETTE[(index || 0) % PALETTE.length];
    }

    var DEFAULT_TARGETS = {"株式":60,"債券":10,"国債":0,"不動産":5,"コモディティ":5,"現金":10,"暗号資産":5,"年金":5,"その他":0};
    var DEFAULT_FIRE = {
      currentAge: 32, monthlySaving: 210000, annualReturnPct: 4,
      annualSpending: 0, sideIncome: 0, withdrawalRatePct: 4,
      inflationPct: 0, crashEnabled: false, crashDropPct: 30,
      taxEnabled: true, sideBurdenRatePct: 20,
      nisaPct: 50, gainSharePct: 50, withdrawalTaxPct: 20.315,
      postRetirementBurden: 400000,
      longevityAge: 100,
      pensionEnabled: true, pensionAnnual: 1300000, pensionStartAge: 65
    };

    var CRASH_SCENARIOS = [
      { id:"lehman", name:"リーマンショック級",
        note:"2008年世界金融危機のピーク→底の下落率を目安にした想定",
        drops:{"株式":50,"債券":10,"国債":0,"不動産":55,"コモディティ":20,"現金":0,"暗号資産":75,"年金":35} },
      { id:"it", name:"ITバブル崩壊級",
        note:"2000〜2002年の下落を目安にした想定（ハイテク中心に大きく下落）",
        drops:{"株式":45,"債券":0,"国債":0,"不動産":25,"コモディティ":10,"現金":0,"暗号資産":80,"年金":30} },
      { id:"corona", name:"コロナショック級",
        note:"2020年2〜3月の急落を目安にした想定",
        drops:{"株式":30,"債券":5,"国債":0,"不動産":35,"コモディティ":15,"現金":0,"暗号資産":50,"年金":20} }
    ];

    // ------------------------------------------------------------------
    // Classification by product name
    // ------------------------------------------------------------------
    function includesAny(n, words) { return words.some(function(w){ return n.indexOf(w) >= 0; }); }
    var CLASSIFY_RULES = [
      { words:["ビットコイン","イーサリアム","暗号資産","仮想通貨","BTC","ETH","リップル","XRP"],
        result:{ assetClass:"暗号資産", currency:"その他", sector:"暗号資産" } },
      { words:["企業型DC","iDeCo","イデコ","確定拠出年金","企業年金","DC"],
        result:{ assetClass:"年金", currency:"JPY", sector:"分散" } },
      { words:["米国債","アメリカ国債","米国国債","トレジャリー"],
        result:{ assetClass:"債券", currency:"USD", sector:"債券" } },
      { words:["個人向け国債","国債","国庫債券","利付国債"],
        result:{ assetClass:"国債", currency:"JPY", sector:"債券" } },
      { words:["預金","普通預金","定期","現金","MRF","MMF"],
        result:{ assetClass:"現金", currency:"JPY", sector:"現金" } },
      { words:["ゴールド","金","GLD","GLDM","IAU","コモディティ","原油","プラチナ","銀"],
        result:{ assetClass:"コモディティ", currency:"USD", sector:"コモディティ" } },
      { words:["REIT","リート","不動産","1343"],
        result:{ assetClass:"不動産", currency:"JPY", sector:"不動産" } },
      { words:["AGG","BND","BNDX","債券","TLT"],
        result:{ assetClass:"債券", currency:"USD", sector:"債券" } },
      { words:["ナスダック","NASDAQ","QQQ","S&P","Ｓ＆Ｐ","VYM","VOO","VTI","VT","米国","アメリカ","ダウ","NYダウ"],
        result:{ assetClass:"株式", currency:"USD", sector:"分散" } },
      { words:["VGK","欧州","ヨーロッパ","ユーロ"],
        result:{ assetClass:"株式", currency:"EUR", sector:"分散" } },
      { words:["VEA","先進国","全世界","オールカントリー","オルカン","MSCI","ACWI","2559","2513"],
        result:{ assetClass:"株式", currency:"USD", sector:"分散" } },
      { words:["新興国","VWO","エマージング"],

    ];
    function classify(name) {
      var normalized = String(name || "").toUpperCase().replace(/\s+/g, "");
      for (var i = 0; i < CLASSIFY_RULES.length; i++) {
        var rule = CLASSIFY_RULES[i];
        if (includesAny(normalized, rule.words) || includesAny(String(name || ""), rule.words)) {
          var out = { assetClass: rule.result.assetClass, currency: rule.result.currency, sector: rule.result.sector };
          if (normalized.indexOf("外貨") >= 0 && out.assetClass === "現金") {
            out.currency = (normalized.indexOf("ユーロ") >= 0 || normalized.indexOf("EUR") >= 0) ? "EUR" : "USD";

    }

    // ------------------------------------------------------------------
    // Sector (field) mix estimation
    // ------------------------------------------------------------------
    var MIX_WORLD = {"テクノロジー":24,"通信":8,"ヘルスケア":11,"金融":15,"消費財":15,"資本財":10,"エネルギー":4,"素材":4,"公益事業":3,"不動産":2,"その他":4};
    var MIX_SP500 = {"テクノロジー":30,"通信":9,"ヘルスケア":12,"金融":13,"消費財":14,"資本財":8,"エネルギー":4,"素材":2,"公益事業":2,"不動産":2,"その他":4};
    var MIX_NASDAQ100 = {"テクノロジー":50,"通信":15,"消費財":15,"ヘルスケア":5,"資本財":5,"その他":10};
    var MIX_DIVIDEND = {"金融":20,"ヘルスケア":15,"消費財":15,"エネルギー":10,"資本財":10,"テクノロジー":8,"公益事業":5,"素材":5,"通信":3,"その他":9};
    var MIX_DEVELOPED = {"テクノロジー":25,"通信":8,"ヘルスケア":12,"金融":15,"消費財":14,"資本財":10,"エネルギー":4,"素材":4,"公益事業":3,"不動産":2,"その他":3};
    var MIX_EMERGING = {"金融":22,"テクノロジー":20,"消費財":15,"通信":10,"資本財":6,"素材":8,"エネルギー":6,"ヘルスケア":4,"公益事業":2,"不動産":2,"その他":5};
    var MIX_JAPAN = {"資本財":18,"テクノロジー":15,"消費財":16,"金融":12,"通信":8,"ヘルスケア":8,"素材":7,"公益事業":3,"不動産":3,"エネルギー":2,"その他":8};

    // 内訳を合計ちょうど100.0%にそろえる：割合按分で正規化し、小数1桁に
    // 丸めた端数は最大の分野で調整する。自動推定・保存済みデータの
    // どちらにも使うので、合計≠100%の内訳が全体の割合をずらすことはない。
    function roundMixTo100(raw) {
      var keys = Object.keys(raw || {}).filter(function(k){ return Number(raw[k]) > 0; });
      if (keys.length === 0) return {"その他":100};
      var sum = keys.reduce(function(s,k){ return s + Number(raw[k]); }, 0);
      if (!(sum > 0)) return {"その他":100};
      var out = {};
      keys.forEach(function(k){ out[k] = Math.round(Number(raw[k]) / sum * 100 * 10) / 10; });
      var total = keys.reduce(function(s,k){ return s + out[k]; }, 0);
      var diff = Math.round((100 - total) * 10) / 10;
      if (diff !== 0) {
        var largest = keys.reduce(function(a,b){ return out[b] > out[a] ? b : a; }, keys[0]);
        out[largest] = Math.round((out[largest] + diff) * 10) / 10;
      }
      keys.forEach(function(k){ if (!(out[k] > 0)) delete out[k]; });
      if (Object.keys(out).length === 0) return {"その他":100};
      return out;
    }

    function estimateSectorMix(name, cls) {
      var n = String(name || "").toUpperCase().replace(/\s+/g, "");
      function has() {
        for (var i = 0; i < arguments.length; i++) {
          if (n.indexOf(String(arguments[i]).toUpperCase()) >= 0 || String(name || "").indexOf(arguments[i]) >= 0) return true;
        }
        return false;
      }
      if (has("テクノロジー","半導体","情報技術","SOXX","XLK")) return {"テクノロジー":100};
      if (has("ヘルスケア","医療","バイオ","XLV")) return {"ヘルスケア":100};
      if (has("通信","XLC")) return {"通信":100};
      if (has("金融","銀行","XLF")) return {"金融":100};
      if (has("エネルギー","XLE")) return {"エネルギー":100};
      if (has("NASDAQ","ナスダック","QQQ")) return Object.assign({}, MIX_NASDAQ100);
      if (has("VYM","HDV","SPYD","SCHD","高配当","配当")) return Object.assign({}, MIX_DIVIDEND);
      if (has("S&P","Ｓ＆Ｐ","VOO","SPY","IVV")) return Object.assign({}, MIX_SP500);
      if (has("全世界","オールカントリー","オルカン","ACWI","VT","2559")) return Object.assign({}, MIX_WORLD);
      if (has("新興国","VWO","エマージング")) return Object.assign({}, MIX_EMERGING);
      if (has("TOPIX","日経","日本株","1306")) return Object.assign({}, MIX_JAPAN);
      if (has("先進国","VEA","MSCI","2513")) return Object.assign({}, MIX_DEVELOPED);
      if (has("VTI","全米","米国株式","米国株","アメリカ")) return Object.assign({}, MIX_SP500);
      switch (cls.assetClass) {
        case "債券": return {"債券":100};
        case "国債": return {"債券":100};
        case "コモディティ": return {"コモディティ":100};
        case "不動産": return {"不動産":100};
        case "暗号資産": return {"暗号資産":100};
        case "現金": return {"現金":100};
      }
      if (cls.sector !== "分散" && cls.sector !== "その他") { var o = {}; o[cls.sector] = 100; return o; }
      if (cls.sector === "分散" || cls.assetClass === "年金") return Object.assign({}, MIX_WORLD);
      return {"その他":100};
    }

    function effectiveMix(h) {
      var stored = Object.keys(h.sectorWeights || {}).filter(function(k){ return h.sectorWeights[k] > 0; });
      var raw;
      if (stored.length > 0) {
        raw = {}; stored.forEach(function(k){ raw[k] = h.sectorWeights[k]; });
      } else {
        raw = estimateSectorMix(h.name, { assetClass: h.assetClass, currency: h.currency, sector: h.sector });
      }
      // 保存済み・読み込みデータの合計が100%でなくても、計算時は必ず
      // 割合按分で正規化し、合計ちょうど100%にしてから使う（黙ってずらさない）。
      return roundMixTo100(raw);
    }

    // ------------------------------------------------------------------
    // Currency exposure (look-through): JPY / USD / EUR / その他, in %.
    // 購入通貨（円建てで買えるファンド等）ではなく、その資産が実質的に
    // どの通貨へさらされているか。初期値は商品名・種類からの推定で、
    // 資産ごとに currencyWeights を保存すればそちらが優先される。
    // ------------------------------------------------------------------
    var EXPOSURE_CURRENCIES = ["JPY","USD","EUR","その他"];
    var CUR_EXP_WORLD = {"USD":70,"EUR":10,"JPY":5,"その他":15};
    var CUR_EXP_DEVELOPED = {"USD":75,"EUR":10,"その他":15};
    var CUR_EXP_EUROPE = {"EUR":70,"その他":30};
    function estimateCurrencyExposure(name, cls) {
      var n = String(name || "").toUpperCase().replace(/\s+/g, "");
      var raw = String(name || "");
      function has() {
        for (var i = 0; i < arguments.length; i++) {
          if (n.indexOf(String(arguments[i]).toUpperCase()) >= 0 || raw.indexOf(arguments[i]) >= 0) return true;
        }
        return false;
      }
      // 為替ヘッジありは、元の通貨が何でも円100%（ヘッジなしは対象外）
      if (has("ヘッジあり","ヘッジ有り","ヘッジ付き","ヘッジ付","為替ヘッジ有","HEDGED")) return {"JPY":100};
      if (has("ビットコイン","イーサリアム","暗号資産","仮想通貨","BTC","ETH","リップル","XRP")) return {"その他":100};
      if (has("全世界","オールカントリー","オルカン","オール・カントリー","ACWI","VT","2559")) return Object.assign({}, CUR_EXP_WORLD);
      if (has("VGK","欧州","ヨーロッパ","ユーロ圏","欧州株")) return Object.assign({}, CUR_EXP_EUROPE);
      if (has("先進国","VEA","2513")) return Object.assign({}, CUR_EXP_DEVELOPED);
      if (has("新興国","VWO","エマージング")) return {"その他":100};
      if (has("ゴールド","GLD","GLDM","IAU","金ETF","純金")) return {"USD":100};
      if (has("米国債","アメリカ国債","米国国債","トレジャリー","AGG","BND","BNDX","TLT")) return {"USD":100};
      if (has("NASDAQ","ナスダック","QQQ","S&P","Ｓ＆Ｐ","VYM","VOO","VTI","SPY","IVV","全米","米国","アメリカ","NYダウ","ダウ","SOXX","テクノロジー","半導体","ヘルスケア","医療","バイオ")) return {"USD":100};
      if (has("TOPIX","日経","日本株","日本株式","1306","個人向け国債","国債")) return {"JPY":100};
      if (has("ユーロ","EUR")) return Object.assign({}, CUR_EXP_EUROPE);
      switch (cls.assetClass) {
        case "国債": return {"JPY":100};
        case "現金": return cls.currency === "USD" ? {"USD":100} : cls.currency === "EUR" ? {"EUR":100} : cls.currency === "JPY" ? {"JPY":100} : {"その他":100};
        case "年金": return Object.assign({}, CUR_EXP_WORLD);
        case "コモディティ": return {"USD":100};
        case "暗号資産": return {"その他":100};
      }
      if (cls.currency === "USD") return {"USD":100};
      if (cls.currency === "EUR") return Object.assign({}, CUR_EXP_EUROPE);
      if (cls.currency === "JPY") return {"JPY":100};
      if (cls.currency && cls.currency !== "JPY") return {"その他":100};
      if (cls.sector === "分散") return Object.assign({}, CUR_EXP_WORLD);
      return {"JPY":100};
    }
    function effectiveCurrencyExposure(h) {
      var stored = Object.keys(h.currencyWeights || {}).filter(function(k){ return EXPOSURE_CURRENCIES.indexOf(k) >= 0 && h.currencyWeights[k] > 0; });
      var raw;
      if (stored.length > 0) {
        raw = {}; stored.forEach(function(k){ raw[k] = h.currencyWeights[k]; });
      } else {
        raw = estimateCurrencyExposure(h.name, { assetClass: h.assetClass, currency: h.currency, sector: h.sector });
      }
      var sum = Object.keys(raw).reduce(function(s,k){ return s + raw[k]; }, 0);
      if (sum <= 0) return {"JPY":100};
      var out = {};
      Object.keys(raw).forEach(function(k){ out[k] = raw[k] / sum * 100; });
      return out;
    }

    function aggregateSectorMix(holdings) {
      var investedTotal = 0, excludedTotal = 0, map = {};
      holdings.forEach(function(h) {
        if (h.assetClass === "現金") { excludedTotal += h.valueJpy; return; }
        investedTotal += h.valueJpy;
        var mix = effectiveMix(h);
        Object.keys(mix).forEach(function(sec) {
          map[sec] = (map[sec] || 0) + h.valueJpy * mix[sec] / 100;
        });
      });
      var slices = Object.keys(map).map(function(name) {
        return { name: name, value: map[name], pct: investedTotal > 0 ? map[name] / investedTotal * 100 : 0 };
      }).filter(function(s){ return s.value > 0; })
        .sort(function(a,b){ return b.value - a.value; });
      return { slices: slices, investedTotal: investedTotal, excludedTotal: excludedTotal };
    }

    // ------------------------------------------------------------------
    // Formatting / parsing
    // ------------------------------------------------------------------
    // 金額表示は丸めない：万円・億円への換算はせず、円単位まで
    // 桁区切りつきで正確に表示する（端数は円単位にそろえるのみ）。
    function fmtYen(v) {
      var sign = v < 0 ? "−" : "";
      return sign + Math.abs(Math.round(v)).toLocaleString("ja-JP") + "円";
    }
    function fmtYenFull(v) { return fmtYen(v); }
    function fmtPct(v, digits) { return v.toFixed(digits == null ? 1 : digits) + "%"; }

    /** Parse a typed yen amount: full/half-width digits, commas, trailing 万/億. */
    function parseAmount(raw) {
      if (typeof raw === "number") return Number.isFinite(raw) && raw >= 0 ? raw : null;
      var normalized = String(raw == null ? "" : raw)
        .replace(/[０-９]/g, function(c){ return String.fromCharCode(c.charCodeAt(0) - 0xfee0); })
        .replace(/[,、\s¥￥円]/g, "");
      if (normalized === "") return null;
      var mult = 1;
      if (normalized.endsWith("億")) { mult = 100000000; normalized = normalized.slice(0, -1); }
      else if (normalized.endsWith("万")) { mult = 10000; normalized = normalized.slice(0, -1); }
      var num = Number(normalized);
      if (!Number.isFinite(num) || num < 0) return null;
      return num * mult;
    }
    /** Parse a typed decimal (for % fields): keeps "4.5" style input valid. */
    function parseDecimal(raw) {
      var normalized = String(raw == null ? "" : raw)
        .replace(/[０-９．]/g, function(c){ return c === "．" ? "." : String.fromCharCode(c.charCodeAt(0) - 0xfee0); })
        .replace(/[,\s%％]/g, "");
      if (normalized === "" ) return null;
      var num = Number(normalized);
      return Number.isFinite(num) ? num : null;
    }
    function esc(s) {
      return String(s == null ? "" : s).replace(/[&<>"']/g, function(c) {
        return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c];
      });
    }

    // ------------------------------------------------------------------
    // Aggregation / simulation
    // ------------------------------------------------------------------
    function totalOf(holdings) { return holdings.reduce(function(s,h){ return s + h.valueJpy; }, 0); }
    function aggregate(holdings, key) {
      var total = totalOf(holdings), map = {};
      holdings.forEach(function(h){ map[h[key]] = (map[h[key]] || 0) + h.valueJpy; });
      return Object.keys(map).map(function(name) {
        return { name: name, value: map[name], pct: total > 0 ? map[name] / total * 100 : 0 };
      }).sort(function(a,b){ return b.value - a.value; });
    }
    function applyDrops(holdings, dropFor) {
      var before = totalOf(holdings), after = 0, classMap = {};
      holdings.forEach(function(h) {
        var d = Math.min(100, Math.max(-100, dropFor(h)));
        var a = h.valueJpy * (1 - d / 100);
        after += a;
        var cur = classMap[h.assetClass] || { before: 0, after: 0 };
        cur.before += h.valueJpy; cur.after += a;
        classMap[h.assetClass] = cur;
      });
      return {
        before: before, after: after, loss: before - after,
        lossPct: before > 0 ? (before - after) / before * 100 : 0,
        byClass: Object.keys(classMap).map(function(name) {
          var v = classMap[name];
          return { name: name, before: v.before, after: v.after,
                   lossPct: v.before > 0 ? (v.before - v.after) / v.before * 100 : 0 };
        }).sort(function(a,b){ return b.before - a.before; })
      };
    }

    // ------------------------------------------------------------------
    // FIRE projection (same math as the original)
    // ------------------------------------------------------------------
    function clampPct(v) { var n = Number(v); if (!Number.isFinite(n)) return 0; return Math.min(100, Math.max(0, n)); }
    // 税金・社会保険料の簡易モデル：有効な前提値をまとめて返す。
    // taxEnabled が false のときは負担率・課税・上乗せはすべて 0 になり、
    // 従来どおり（税・社保を考慮しない）計算と一致する。
    function fireTaxParams(s) {
      var enabled = !!s.taxEnabled;
      var sideRate = enabled ? clampPct(s.sideBurdenRatePct) : 0;
      // 取り崩し課税：税額 = 取り崩し額 × 非NISA割合 × 利益部分の割合 × 税率。
      // NISA分は非課税、非NISA分も利益部分にのみ税率がかかる前提。
      var nisaPct = enabled ? clampPct(s.nisaPct == null ? 50 : s.nisaPct) : 100;
      var gainPct = enabled ? clampPct(s.gainSharePct == null ? 50 : s.gainSharePct) : 0;
      var wTaxPct = enabled ? clampPct(s.withdrawalTaxPct == null ? 20.315 : s.withdrawalTaxPct) : 0;
      var dragRate = enabled ? (1 - nisaPct / 100) * (gainPct / 100) * (wTaxPct / 100) : 0;
      var burden = enabled ? Math.max(0, Number(s.postRetirementBurden) || 0) : 0;
      var sideGross = Math.max(0, Number(s.sideIncome) || 0);
      var sideNet = sideGross * (1 - sideRate / 100);
      return {
        enabled: enabled, sideBurdenRatePct: sideRate,
        nisaPct: nisaPct, nonNisaPct: 100 - nisaPct, gainSharePct: gainPct, withdrawalTaxPct: wTaxPct,
        dragRate: dragRate, netFactor: 1 - dragRate,
        burden: burden, sideGross: sideGross, sideNet: sideNet
      };
    }
    // 公的年金：65歳時点の見込み年額を、受給開始年齢で自動調整する。
    // 繰上げは1か月あたり−0.4%（60歳で−24%）、繰下げは1か月あたり
    // ＋0.7%（70歳で＋42%、75歳で＋84%）。年金額は手取り想定の入力とし、
    // 年金自体への課税は別途計算しない。
    function firePensionParams(s) {
      var enabled = !!s.pensionEnabled;
      var base = enabled ? Math.max(0, Number(s.pensionAnnual) || 0) : 0;
      var startAge = Math.round(Number(s.pensionStartAge) || 65);
      startAge = Math.min(75, Math.max(60, startAge));
      var months = (startAge - 65) * 12;
      var factor = months < 0 ? 1 + months * 0.004 : 1 + months * 0.007;
      return {
        enabled: enabled, baseAnnual: base, startAge: startAge,
        months: months, factor: factor, adjustedAnnual: base * factor
      };
    }
    // その年（現在から y 年後、年齢 = currentAge + y）に受け取る年金額。
    // 受給開始年齢より前は 0。インフレ調整は支出側と同じ指数で行う呼び出し側前提で、
    // ここでは「現在の物価水準での年額」を返す。
    function firePensionAt(s, pension, y) {
      if (!pension.enabled || pension.adjustedAnnual <= 0) return 0;
      var age = (Number(s.currentAge) || 0) + y;
      return age >= pension.startAge ? pension.adjustedAnnual : 0;
    }
    // その年に必要な「額面の取り崩し額」。手取りで必要な額（生活費＋退職後の
    // 公的負担 − 年金収入 − パート手取り、0未満にはしない）を、取り崩し
    // 課税の目減り分だけ割り戻す。
    function fireGrossFullAt(s, tax, g, y) {
      var pension = firePensionParams(s);
      var netNeed = Math.max(0, (Number(s.annualSpending) || 0) + tax.burden - firePensionAt(s, pension, y));
      return tax.netFactor > 0 ? netNeed * Math.pow(1 + g, y) / tax.netFactor : Infinity;
    }
    function fireGrossSideAt(s, tax, g, y) {
      var pension = firePensionParams(s);
      var netRemain = Math.max(0, (Number(s.annualSpending) || 0) + tax.burden - firePensionAt(s, pension, y) - tax.sideNet);
      return tax.netFactor > 0 ? netRemain * Math.pow(1 + g, y) / tax.netFactor : Infinity;
    }
    function fireLongevityAge(s) {
      var L = Math.round(Number(s.longevityAge) || 100);
      return Math.min(120, Math.max((Number(s.currentAge) || 0) + 1, L));
    }
    // 想定寿命まで枯渇しないために、その年（year）の時点で必要な残高。
    // 取り崩しを後ろから割り戻して求める：need_{y} = (need_{y+1} + 支出_y) / (1+r)
    function fireRequiredSeries(s, tax, g, r, n, side) {
      var req = new Array(n + 1);
      var need = 0;
      req[n] = 0;
      for (var y = n - 1; y >= 0; y--) {
        var spend = side ? fireGrossSideAt(s, tax, g, y) : fireGrossFullAt(s, tax, g, y);
        need = (need + spend) / (1 + r);
        req[y] = need;
      }
      return req;
    }
    function fireProject(startBalance, s) {
      var r = s.annualReturnPct / 100, g = s.inflationPct / 100;
      var tax = fireTaxParams(s);
      var L = fireLongevityAge(s), n = L - s.currentAge;
      var reqFull = fireRequiredSeries(s, tax, g, r, n, false);
      var reqSide = fireRequiredSeries(s, tax, g, r, n, true);
      var series = [], balance = startBalance;
      var reachFull = null, reachSide = null, depleteFull = null, depleteSide = null;
      var balSideDraw = null;
      function spendingAt(y) { return fireGrossFullAt(s, tax, g, y); }
      function sideNeedAt(y) { return fireGrossSideAt(s, tax, g, y); }
      for (var year = 0; year <= n; year++) {
        var age = s.currentAge + year;
        var tF = reqFull[year], tS = reqSide[year];
        series.push({ age: age, balance: Math.max(0, balance), targetFull: tF, targetSide: tS });
        if (reachSide === null && balance >= tS) { reachSide = age; balSideDraw = balance; }
        if (reachFull === null && balance >= tF && tF > 0) { reachFull = age; }
        if (reachFull === null) {
          balance = balance * (1 + r) + s.monthlySaving * 12;
        } else if (depleteFull === null) {
          balance = balance * (1 + r) - spendingAt(year);
          if (balance <= 0 && age < L) depleteFull = age + 1;
        }
        if (balSideDraw !== null && depleteSide === null && reachSide !== age) {
          balSideDraw = balSideDraw * (1 + r) - sideNeedAt(year);
          if (balSideDraw <= 0 && age < L) depleteSide = age + 1;
        }

    // ------------------------------------------------------------------
    // SVG builders: donut + line chart
    // ------------------------------------------------------------------
    function donutSVG(slices, size, centerMain, centerSub) {
      var total = slices.reduce(function(s,x){ return s + x.value; }, 0);
      var r = 70, c = 2 * Math.PI * r, cx = 90, cy = 90;
      var parts = "";
      if (total <= 0) {
        parts = '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="none" stroke="var(--surface-2)" stroke-width="26"/>';
      } else {
        var offset = 0;
        slices.forEach(function(s, i) {
          var frac = s.value / total;
          if (frac <= 0) return;
          var dash = Math.max(0, frac * c - 1.5);
          parts += '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="none" stroke="' + colorFor(s.name, i) +
            '" stroke-width="26" stroke-dasharray="' + dash.toFixed(2) + " " + (c - dash).toFixed(2) +
            '" stroke-dashoffset="' + (-offset).toFixed(2) + '" transform="rotate(-90 ' + cx + " " + cy + ')"/>';
          offset += frac * c;
        });
      }
      // 中央の金額は円単位の正確表示で長くなるため、文字数に応じて
      // フォントサイズを落としてドーナツ内に収める。
      var mainLen = String(centerMain == null ? "" : centerMain).length;
      var mainSize = mainLen <= 8 ? 17 : mainLen <= 11 ? 14.5 : mainLen <= 14 ? 12 : 10.5;
      return '<svg viewBox="0 0 180 180" width="' + size + '" height="' + size + '" role="img" aria-label="割合グラフ">' + parts +
        '<text x="' + cx + '" y="' + (cy - 2) + '" text-anchor="middle" font-size="' + mainSize + '" font-weight="800" fill="var(--text)" class="num">' + esc(centerMain) + "</text>" +
        '<text x="' + cx + '" y="' + (cy + 18) + '" text-anchor="middle" font-size="10.5" fill="var(--dim)">' + esc(centerSub) + "</text></svg>";
    }
    function sliceListHTML(slices) {
      if (slices.length === 0) return "";
      var max = Math.max.apply(null, slices.map(function(s){ return s.pct; }).concat([0]));
      return '<ul class="slice-list">' + slices.map(function(s, i) {
        return "<li>" +
          '<div class="slice-head"><span class="dot" style="background:' + colorFor(s.name, i) + '"></span>' +
          '<span class="slice-name">' + esc(s.name) + '</span>' +
          '<span class="slice-val num">' + fmtYen(s.value) + "</span>" +
          '<span class="slice-pct num">' + fmtPct(s.pct) + "</span></div>" +
          '<div class="bar-track"><div class="bar-fill" style="background:' + colorFor(s.name, i) + ";width:" +
            (max > 0 ? (s.pct / max * 100).toFixed(1) : 0) + '%"></div></div></li>';
      }).join("") + "</ul>";
    }
    /** Multi-series line chart. series: [{label,color,dash,points:[{x,y}]}] */
    function lineChartSVG(series, xLabelEvery, yFmt, height) {
      var W = 640, H = height || 240, padL = 118, padR = 10, padT = 12, padB = 26;
      var allX = [], allY = [];
      series.forEach(function(sr) { sr.points.forEach(function(p) { allX.push(p.x); if (Number.isFinite(p.y)) allY.push(p.y); }); });
      if (allX.length === 0 || allY.length === 0) return "";
      var xMin = Math.min.apply(null, allX), xMax = Math.max.apply(null, allX);
      var yMin = Math.min.apply(null, allY.concat([0])), yMax = Math.max.apply(null, allY);
      if (yMax <= yMin) yMax = yMin + 1;
      var yPad = (yMax - yMin) * 0.08; yMax += yPad; if (yMin > 0) yMin = Math.max(0, yMin - yPad);
      function X(x) { return padL + (xMax === xMin ? 0.5 : (x - xMin) / (xMax - xMin)) * (W - padL - padR); }
      function Y(y) { return padT + (1 - (y - yMin) / (yMax - yMin)) * (H - padT - padB); }
      var out = '<svg viewBox="0 0 ' + W + " " + H + '" style="width:100%;height:auto;display:block" role="img" aria-label="推移グラフ">';
      for (var gi = 0; gi <= 3; gi++) {
        var gy = yMin + (yMax - yMin) * gi / 3;
        out += '<line x1="' + padL + '" x2="' + (W - padR) + '" y1="' + Y(gy) + '" y2="' + Y(gy) + '" stroke="var(--border)" stroke-dasharray="3 3"/>' +
          '<text x="' + (padL - 6) + '" y="' + (Y(gy) + 4) + '" text-anchor="end" font-size="11" fill="var(--dim)" class="num">' + esc(yFmt(gy)) + "</text>";
      }
      var step = Math.max(1, Math.round((xMax - xMin) / 6));
      for (var xv = xMin; xv <= xMax; xv += step) {
        out += '<text x="' + X(xv) + '" y="' + (H - 6) + '" text-anchor="middle" font-size="11" fill="var(--dim)" class="num">' + esc(xLabelEvery(xv)) + "</text>";
      }
      series.forEach(function(sr) {
        var d = "";
        sr.points.forEach(function(p) {
          if (!Number.isFinite(p.y)) return;
          d += (d === "" ? "M" : "L") + X(p.x).toFixed(1) + " " + Y(p.y).toFixed(1) + " ";
        });
        if (d) out += '<path d="' + d + '" fill="none" stroke="' + sr.color + '" stroke-width="2.2" ' +
          (sr.dash ? 'stroke-dasharray="6 4"' : "") + ' stroke-linejoin="round"/>';
        sr.points.forEach(function(p) {
          if (!Number.isFinite(p.y)) return;
          out += '<circle cx="' + X(p.x).toFixed(1) + '" cy="' + Y(p.y).toFixed(1) + '" r="2.4" fill="' + sr.color + '"/>';
        });
      });
      out += "</svg>";
      var legend = series.map(function(sr) {
        return '<span style="display:inline-flex;align-items:center;gap:6px;margin-right:14px;font-size:12.5px;color:var(--dim)">' +
          '<span style="display:inline-block;width:16px;border-top:3px ' + (sr.dash ? "dashed" : "solid") + " " + sr.color + '"></span>' + esc(sr.label) + "</span>";
      }).join("");
      return out + '<div style="margin-top:6px">' + legend + "</div>";
    }

      if (!s.endsWith("円")) return '<span class="num">' + esc(s) + "</span>";
      return '<span class="num">' + esc(s.slice(0, -1)) + '</span><span style="font-size:0.42em;font-weight:700;margin-left:2px">円</span>';
    }

    // Currency breakdown for the dashboard: look-through (実質的な通貨
    // エクスポージャー). Each holding's yen value is split by its
    // effective currency exposure (stored currencyWeights, or the
    // name-based estimate), so a yen-denominated world fund still
    // counts mostly as USD exposure. All four buckets are always
    // listed (even at ¥0) so the split is readable at a glance.
    function currencyDisplaySlices(holdings) {
      var total = totalOf(holdings);
      var buckets = { JPY: 0, USD: 0, EUR: 0, OTHER: 0 };
      holdings.forEach(function(h) {
        var exp = effectiveCurrencyExposure(h);
        buckets.JPY += h.valueJpy * (exp.JPY || 0) / 100;
        buckets.USD += h.valueJpy * (exp.USD || 0) / 100;
        buckets.EUR += h.valueJpy * (exp.EUR || 0) / 100;
        buckets.OTHER += h.valueJpy * (exp["その他"] || 0) / 100;
      });
      function pct(v) { return total > 0 ? v / total * 100 : 0; }
      return [
        { name: "円（JPY）", value: buckets.JPY, pct: pct(buckets.JPY) },
        { name: "米ドル（USD）", value: buckets.USD, pct: pct(buckets.USD) },
        { name: "ユーロ（EUR）", value: buckets.EUR, pct: pct(buckets.EUR) },
        { name: "その他", value: buckets.OTHER, pct: pct(buckets.OTHER) }
      ];

    // 目標配分を合計100%へ換算した値（%）で返す。合計が0なら null。
    function normalizedTargets() {
      var sum = ASSET_CLASSES.reduce(function(s,c){ return s + (Number(state.targets[c]) || 0); }, 0);
      if (!(sum > 0)) return null;
      var out = {};
      ASSET_CLASSES.forEach(function(c){ out[c] = (Number(state.targets[c]) || 0) / sum * 100; });
      return { map: out, rawSum: sum };
    }
    function classPctMap(byClass) {
      var m = {};
      byClass.forEach(function(s){ m[s.name] = s.pct; });
      return m;
    }
    function classValMap(byClass) {
      var m = {};
      byClass.forEach(function(s){ m[s.name] = s.value; });
      return m;
    }
    function signedPct(v) { return (v >= 0 ? "+" : "−") + Math.abs(v).toFixed(1) + "%"; }
    function signedPoint(v) { return (v >= 0 ? "+" : "−") + Math.abs(v).toFixed(1) + "ポイント"; }

    // ----------------------------------------------------------------
    // ルールベースの簡易アドバイス
    // 登録データだけから機械的に判定する。根拠の数字を必ず添え、
    // データがない・未設定の項目については何も出さない。
    // ----------------------------------------------------------------
    function buildAdvice(byClass, byCurrency, mix, fireRes, total) {
      var good = [], warn = [];
      var pctOf = classPctMap(byClass), valOf = classValMap(byClass);
      function pct(name) { return pctOf[name] || 0; }

      // --- 目標配分との乖離（±5ポイント以上を「大きい」とする） ---
      var nt = normalizedTargets();
      if (nt) {
        var diffs = ASSET_CLASSES.map(function(c) {
          return { name: c, target: nt.map[c], current: pct(c), diff: pct(c) - nt.map[c] };
        }).filter(function(d){ return d.target > 0 || d.current > 0; });
        var big = diffs.filter(function(d){ return Math.abs(d.diff) >= 5; })
          .sort(function(a,b){ return Math.abs(b.diff) - Math.abs(a.diff); });
        big.slice(0, 3).forEach(function(d) {
          warn.push("「" + d.name + "」が目標 " + fmtPct(d.target) + " に対して現在 " + fmtPct(d.current) + " と、" + signedPoint(d.diff) + " ずれている。" +
            (d.diff > 0 ? "目標より厚くなっているので、買い増しを控える・一部を他へ回すなどの調整候補。" : "目標より薄いので、買い増し候補として検討できる。"));

    // ------------------------------------------------------------------

    // ------------------------------------------------------------------
    var simState = { mode: "scenario", scenarioId: "lehman", uniformPct: 30, custom: null, yenMove: 20, fxCurrentRate: 155, fxTargetRate: 120 };
    // 為替：ドル円が 現在レート → 目標レート へ動いたときの外貨建て資産の倍率。
    // 例）155円 → 120円 なら倍率は 120/155（円高で外貨建ては目減り）。
    function fxFactor() {
      var cur = Number(simState.fxCurrentRate), tgt = Number(simState.fxTargetRate);
      if (!Number.isFinite(cur) || cur <= 0 || !Number.isFinite(tgt) || tgt <= 0) return 1;
      return tgt / cur;
    }
    function fxChangePct() { return (fxFactor() - 1) * 100; }
    function fxDirectionLabel() {
      var p = fxChangePct();
      if (Math.abs(p) < 0.05) return "変動なし";
      return p < 0 ? "円高" : "円安";
    }
    function fxTargetLabel() {
      var p = fxChangePct();
      return simState.fxTargetRate + "円（外貨 " + (p >= 0 ? "+" : "−") + Math.abs(p).toFixed(1) + "%・" + fxDirectionLabel() + "）";
    }
    function fxByCurrency(holdings) {
      var factor = fxFactor();
      var buckets = [
        { name: "円（JPY）", key: "JPY", before: 0 },
        { name: "米ドル（USD）", key: "USD", before: 0 },
        { name: "ユーロ（EUR）", key: "EUR", before: 0 },
        { name: "その他", key: "その他", before: 0 }
      ];
      holdings.forEach(function(h) {
        var exp = effectiveCurrencyExposure(h);
        buckets.forEach(function(b) { b.before += h.valueJpy * (exp[b.key] || 0) / 100; });
      });
      buckets.forEach(function(b) {
        b.after = b.key === "JPY" ? b.before : b.before * factor;

    function fxHoldingFactor(h) {

      return (exp.JPY || 0) / 100 + foreign / 100 * fxFactor();

        for (var ki = 0; ki < keys.length; ki++) {

      state.snapshots.push({ id: newId(), totalJpy: totalOf(state.assets), breakdown: breakdown, recordedAt: new Date().toISOString() });
      saveState();
      if (feedbackEl) feedbackEl.textContent = "記録しました（「記録・データ」タブで確認できます）";
    }

    // ------------------------------------------------------------------
    // Event binding
    // ------------------------------------------------------------------
    function bindView() {
      // Chips inside the asset form
      document.querySelectorAll("[data-chip-group]").forEach(function(groupEl) {
        var group = groupEl.getAttribute("data-chip-group");
        groupEl.querySelectorAll("[data-chip]").forEach(function(btn) {
          btn.addEventListener("click", function() {
            var v = btn.getAttribute("data-chip");
            formState.cls[group] = v;
            if (group === "assetClass") formState.manualClass = true;
            if (group === "currency") formState.manualCurrency = true;
            if (group === "sector") formState.manualSector = true;
            groupEl.querySelectorAll("[data-chip]").forEach(function(b) {
              b.setAttribute("aria-pressed", b.getAttribute("data-chip") === v ? "true" : "false");
            });
            refreshMixEstimate();
          });
        });
      });
      var nameEl = document.getElementById("fName");
      if (nameEl) {
        nameEl.addEventListener("input", function() {
          if (!formState) return;
          var c = classify(nameEl.value);
          if (!formState.manualClass) formState.cls.assetClass = c.assetClass;
          if (!formState.manualCurrency) formState.cls.currency = c.currency;
          if (!formState.manualSector) formState.cls.sector = c.sector;
          // Reflect chip selection without re-rendering (keeps caret in place)
          [["assetClass", formState.cls.assetClass], ["currency", formState.cls.currency], ["sector", formState.cls.sector]].forEach(function(pair) {
            var g = document.querySelector('[data-chip-group="' + pair[0] + '"]');
            if (g) g.querySelectorAll("[data-chip]").forEach(function(b) {
              b.setAttribute("aria-pressed", b.getAttribute("data-chip") === pair[1] ? "true" : "false");
            });
          });
          refreshMixEstimate();
        });
      }
      bindMix();
      bindCurMix();
      // Target inputs: commit on change (blur/Enter) — typed text is kept
      // untouched while editing; only the rebalance box re-renders.
      document.querySelectorAll("[data-target]").forEach(function(inp) {
        var commitTarget = function() {
          var cls = inp.getAttribute("data-target");
          var v = parseDecimal(inp.value);
          if (v === null) return;
          state.targets[cls] = Math.min(100, Math.max(0, v));
          saveState();
          // Update only the sum + rebalance blocks; the inputs themselves
          // are never re-created, so a value can never land in another row.
          var sumEl = document.getElementById("targetSum");
          if (sumEl) sumEl.innerHTML = targetSumInner();
          var box = document.getElementById("rebalanceBox");
          if (box) box.innerHTML = rebalanceHTML();
        };
        inp.addEventListener("input", commitTarget);
        inp.addEventListener("change", commitTarget);
      });
      // Sim controls
      document.querySelectorAll("[data-sim-mode]").forEach(function(btn) {
        btn.addEventListener("click", function() { simState.mode = btn.getAttribute("data-sim-mode"); render(); });
      });
      document.querySelectorAll("[data-sim-scenario]").forEach(function(btn) {
        btn.addEventListener("click", function() { simState.scenarioId = btn.getAttribute("data-sim-scenario"); render(); });
      });
      document.querySelectorAll("[data-slider]").forEach(function(sl) {
        sl.addEventListener("input", function() {
          var key = sl.getAttribute("data-slider");
          var v = Number(sl.value);
          if (key === "uniform") { simState.uniformPct = v; var o1 = document.getElementById("sv-uniform"); if (o1) o1.textContent = v + "%"; }
          else if (key === "fxTarget") {
            simState.fxTargetRate = v;
            var o2 = document.getElementById("sv-fxTarget"); if (o2) o2.textContent = fxTargetLabel();
            var ti = document.getElementById("fxTargetInput"); if (ti) ti.value = String(v);
            document.querySelectorAll("[data-fx-quick]").forEach(function(b){ b.setAttribute("aria-pressed", Number(b.getAttribute("data-fx-quick")) === v ? "true" : "false"); });
          } else if (key.indexOf("custom:") === 0) {
            if (!simState.custom) simState.custom = {};
            simState.custom[key.slice(7)] = v;
            var o3 = document.getElementById("sv-" + key);
            if (o3) o3.textContent = v + "%";
          }
          updateSimResult();
        });
      });
      // FX rate numeric inputs: update the maths without rewriting the
      // field being typed in (same rule as the FIRE inputs).
      document.querySelectorAll("[data-fx]").forEach(function(inp) {
        inp.addEventListener("input", function() {
          var which = inp.getAttribute("data-fx");
          var v = parseDecimal(inp.value);
          if (v === null || v <= 0) return;
          if (which === "current") {
            simState.fxCurrentRate = v;
            var o = document.getElementById("sv-fxTarget"); if (o) o.textContent = fxTargetLabel();
          } else if (which === "target") {
            if (v < 80 || v > 220) return; // slider range; accept on change below
            simState.fxTargetRate = v;
            var sl = document.querySelector('[data-slider="fxTarget"]'); if (sl) sl.value = String(v);
            var o2 = document.getElementById("sv-fxTarget"); if (o2) o2.textContent = fxTargetLabel();
            document.querySelectorAll("[data-fx-quick]").forEach(function(b){ b.setAttribute("aria-pressed", Number(b.getAttribute("data-fx-quick")) === v ? "true" : "false"); });
          }
          updateSimResult();
        });
        inp.addEventListener("change", function() {
          var which = inp.getAttribute("data-fx");
          var v = parseDecimal(inp.value);
          if (v === null || v <= 0) { render(); return; }
          if (which === "target") simState.fxTargetRate = Math.min(220, Math.max(80, v));
          if (which === "current") simState.fxCurrentRate = Math.min(400, Math.max(30, v));
          render();
        });
      });
      document.querySelectorAll("[data-fx-quick]").forEach(function(btn) {
        btn.addEventListener("click", function() { simState.fxTargetRate = Number(btn.getAttribute("data-fx-quick")); render(); });
      });
      // FIRE inputs: commit parsed value on input/change without ever
      // rewriting the input's own text, so "4.5" / "300万" never vanish.
      document.querySelectorAll("[data-fire]").forEach(function(inp) {
        var commit = function() {
          var key = inp.getAttribute("data-fire");
          var kind = inp.getAttribute("data-kind");
          var v = kind === "yen" ? parseAmount(inp.value) : parseDecimal(inp.value);
          if (v === null) return;
          if (key === "currentAge") v = Math.min(100, Math.max(0, Math.round(v)));
          if (key === "sideBurdenRatePct" || key === "nisaPct" || key === "gainSharePct" || key === "withdrawalTaxPct") v = Math.min(100, Math.max(0, v));
          if (key === "longevityAge") v = Math.min(120, Math.max(60, Math.round(v)));
          if (key === "pensionStartAge") v = Math.min(75, Math.max(60, Math.round(v)));
          state.fire[key] = v;
          saveState();
          var penNote = document.getElementById("pensionAdjustedNote");
          if (penNote) penNote.textContent = pensionAdjustedText(firePensionParams(state.fire));
          updateFireResults();
        };
        inp.addEventListener("input", commit);
        inp.addEventListener("change", commit);
      });
      var crashBox = document.querySelector("[data-fire-crash]");
      if (crashBox) {
        crashBox.addEventListener("change", function() {
          state.fire.crashEnabled = crashBox.checked;
          saveState();
          render(); // re-render shows/hides the crash % field
        });
      }
      var taxBox = document.querySelector("[data-fire-tax]");
      if (taxBox) {
        taxBox.addEventListener("change", function() {
          state.fire.taxEnabled = taxBox.checked;
          saveState();
          render(); // re-render shows/hides the tax fields
        });
      }
      var pensionBox = document.querySelector("[data-fire-pension]");
      if (pensionBox) {
        pensionBox.addEventListener("change", function() {
          state.fire.pensionEnabled = pensionBox.checked;
          saveState();
          render(); // re-render shows/hides the pension fields
        });
      }
      var fileEl = document.getElementById("importFile");
      if (fileEl) {
        fileEl.addEventListener("change", function() {
          var file = fileEl.files && fileEl.files[0];
          fileEl.value = "";
          if (!file) return;
          readImportFile(file).then(function(text) {
            var parsed;
            try { parsed = JSON.parse(String(text || "").replace(/^\uFEFF/, "")); } catch (e) {
              showDataMsg(null, "JSONとして読み取れませんでした。書き出したファイルを選んでください。現在のデータは変更していません。");
              return;
            }
            var res = importJSONData(parsed);
            if (res.error) { showDataMsg(null, res.error); return; }
            formState = null;
            var msg = "読み込みが完了しました：資産 " + res.assets + "件（合計 " + fmtYenFull(res.totalJpy) + "）・記録 " + res.snapshots + "件を反映しました。概要タブの総資産と資産一覧に反映されています。";
            if (res.skipped > 0) msg += " ※" + res.skipped + "件は商品名・金額を読み取れず除外しました。";
            if (res.persisted === false) msg += " ※この端末への保存を確認できませんでした。ブラウザの保存が制限されている可能性があります。";
            importNotice = { ok: msg, err: null };
            render();
            showDataMsg(msg, null);
          }).catch(function() {
            showDataMsg(null, "ファイルを読めませんでした。現在のデータは変更していません。");
          });
        });
      }
    }
    function showDataMsg(ok, err) {
      importNotice = { ok: ok || null, err: err || null };
      var okEl = document.getElementById("dataOk");
      var errEl = document.getElementById("dataErr");
      if (okEl) { okEl.textContent = ok || ""; okEl.classList.toggle("hidden", !ok); }
      if (errEl) { errEl.textContent = err || ""; errEl.classList.toggle("hidden", !err); }
    }

    // Delegated actions
    document.addEventListener("click", function(e) {
      var el = e.target.closest("[data-action]");
      if (!el) return;
      var action = el.getAttribute("data-action");
      var id = el.getAttribute("data-id");
      if (action === "go-assets") goTab("assets");
      else if (action === "go-dashboard") goTab("dashboard");
      else if (action === "go-fire") goTab("fire");
      else if (action === "record-snapshot") recordSnapshot(document.getElementById("snapFeedback"));
      else if (action === "add-asset") openForm(null);
      else if (action === "edit-asset") {
        var a = state.assets.find(function(x){ return x.id === id; });
        if (a) openForm(a);
      }
      else if (action === "cancel-form") { formState = null; render(); }
      else if (action === "save-asset") saveAssetFromForm();
      else if (action === "ask-delete") { formState = { deleteId: id }; render(); }
      else if (action === "ask-delete-snap") { formState = { deleteSnapId: id }; render(); }
      else if (action === "cancel-delete") { formState = null; render(); }
      else if (action === "delete-asset") {
        state.assets = state.assets.filter(function(x){ return x.id !== id; });
        formState = null; saveState(); render();
      }
      else if (action === "delete-snapshot") {
        state.snapshots = state.snapshots.filter(function(x){ return x.id !== id; });
        formState = null; saveState(); render();
      }
      else if (action === "copy-ai-summary") copyAiSummary();
      else if (action === "export-json") exportJSON();
      else if (action === "import-json") {
        var f = document.getElementById("importFile");
        if (f) f.click();
      }
    });

    // Init (state loads here, once every helper above is initialized)
    state = loadState();
    storageOK = testStorage();
    if (restoreInfo && stateHasData(state)) {
      // Migrated / recovered data: write it under the current key right
      // away so the next open reads it from the primary location.
      saveState();
      showRestoreBanner();
    } else if (restoreInfo && restoreInfo.kind === "stash") {
      // Unrecovered: the original data could not be read. Keep saves
      // blocked (recoveryPending was set by loadState) AND initialize
      // lastPayload to the current state, so the pagehide flush below
      // does not mistake "never saved this session" for "unsaved
      // changes" and overwrite the primary/backup with a blank state.
      recoveryPending = true;
      try { lastPayload = JSON.stringify(state); } catch (e) { lastPayload = null; }
      showRestoreBanner();
    }
    if (!storageOK) {
      updateSaveStatus(false);
      if (!restoreInfo) showStorageWarning();
    } else if (!restoreInfo) {
      try { lastPayload = JSON.stringify(state); } catch (e) { lastPayload = null; }
      updateSaveStatus(true, stateHasData(state) ? "保存済み（前回のデータを読み込みました）" : "入力すると自動でこの端末に保存されます");
    }
    // Last-resort flush if anything changed without a save (there
    // should be nothing: every mutation saves immediately).
    window.addEventListener("pagehide", function() {
      if (recoveryPending) return; // never flush over an unrecovered original
      try { if (JSON.stringify(state) !== lastPayload) saveState(); } catch (e) {}
    });
    renderTabs();
    render();
    </script>
  </body>
</html>
